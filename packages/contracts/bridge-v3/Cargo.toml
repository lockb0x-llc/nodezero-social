[workspace]
members = [
  "lockb0x-bridge-account",
  "lockb0x-bridge-factory",
  "lockb0x-bridge-verifier",
  "tools/bridge-vk-encoder",
]
default-members = [
  "lockb0x-bridge-account",
  "lockb0x-bridge-factory",
  "lockb0x-bridge-verifier",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
soroban-sdk = "27.0.1"
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-snark = { version = "0.5", default-features = false }
wee_alloc = { version = "0.4", default-features = false }
serde_json = "1.0"

[profile.release]
opt-level = "z"
panic = "abort"
strip = "symbols"
lto = true
codegen-units = 1
overflow-checks = true