#cloud-config
package_update: true
package_upgrade: true
packages:
  - ca-certificates
  - curl
  - git
  - unattended-upgrades
runcmd:
  - [ bash, -lc, "install -m 0755 -d /etc/apt/keyrings" ]
  - [ bash, -lc, "curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc" ]
  - [ bash, -lc, "chmod a+r /etc/apt/keyrings/docker.asc" ]
  - [ bash, -lc, "echo 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable' > /etc/apt/sources.list.d/docker.list" ]
  - [ bash, -lc, "apt-get update && apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin" ]
  - [ bash, -lc, "usermod -aG docker __ADMIN_USERNAME__" ]
  - [ bash, -lc, "install -d -o __ADMIN_USERNAME__ -g __ADMIN_USERNAME__ -m 0750 /opt/nodezero" ]
  - [ bash, -lc, "systemctl enable --now docker" ]
  - [ bash, -lc, "ufw default deny incoming && ufw default allow outgoing && ufw allow 22/tcp && ufw allow 80/tcp && ufw allow 443/tcp && ufw --force enable" ]
