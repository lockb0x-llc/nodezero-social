name: Inspect Namecheap Secret Shape

on:
  workflow_dispatch:

jobs:
  inspect:
    name: Inspect Namecheap secret shape
    runs-on: ubuntu-latest
    env:
      NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
      NAMECHEAP_API_USER: ${{ vars.NAMECHEAP_API_USER || secrets.NAMECHEAP_API_USER }}
      NAMECHEAP_USERNAME: ${{ vars.NAMECHEAP_USERNAME || secrets.NAMECHEAP_USERNAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect secret shape
        run: node scripts/dns/inspect-namecheap-secret-shape.mjs
