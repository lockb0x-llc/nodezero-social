name: Capture Staging Baseline

on:
  workflow_call:
    inputs:
      expected_deployed_commit:
        description: Exact commit currently recorded by the live staging marker
        required: true
        type: string
      confirm_staging_testnet:
        description: Confirm this captures the current staging-testnet N-1 baseline
        required: true
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  capture-baseline:
    name: Capture current staging-testnet N-1
    if: ${{ inputs.confirm_staging_testnet == true }}
    runs-on: ubuntu-latest
    environment: staging-testnet

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: rg-nodezero-social-staging-testnet
      JSS_PROVISIONER_APP_NAME: nodezero-social-staging-testnet-provisioner
      RELAY_APP_NAME: nodezero-social-staging-testnet-relay
      STAGING_BASE_URL: https://staging.nodezero.social

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Verify requested SHA matches live staging provenance
        id: live
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_deployed_commit }}
        run: |
          set -euo pipefail
          marker="$(node ./scripts/qa/fetch-exact.mjs "${STAGING_BASE_URL}/deploy-marker.json")"
          [ "$(jq -r '.environment // empty' <<<"$marker")" = "staging-testnet" ]
          [ "$(jq -r '.workflow // empty' <<<"$marker")" = "staging-deploy" ]
          live_commit="$(jq -r '.commit // empty' <<<"$marker")"
          [ "$live_commit" = "$EXPECTED_COMMIT" ]
          [ "${#live_commit}" -eq 40 ]
          echo "commit=$live_commit" >> "$GITHUB_OUTPUT"
          echo "run_id=$(jq -r '.runId' <<<"$marker")" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.runAttempt' <<<"$marker")" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$marker" > /tmp/live-marker.json

      - name: Authenticate live marker deployment run and attempt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_COMMIT: ${{ steps.live.outputs.commit }}
          LIVE_RUN_ID: ${{ steps.live.outputs.run_id }}
          LIVE_RUN_ATTEMPT: ${{ steps.live.outputs.run_attempt }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LIVE_RUN_ID}/attempts/${LIVE_RUN_ATTEMPT}")"
          [ "$(jq -r '.status' <<<"$run_json")" = "completed" ]
          [ "$(jq -r '.conclusion' <<<"$run_json")" = "success" ]
          [ "$(jq -r '.head_sha' <<<"$run_json")" = "$LIVE_COMMIT" ]
          [ "$(jq -r '.head_branch' <<<"$run_json")" = "testnet" ]
          [ "$(jq -r '.run_attempt' <<<"$run_json")" = "$LIVE_RUN_ATTEMPT" ]
          [[ "$(jq -r '.path' <<<"$run_json")" == */staging-deploy.yml ]]

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact source dependencies
        run: pnpm install --frozen-lockfile

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Reconfirm live marker before capture
        env:
          EXPECTED_COMMIT: ${{ steps.live.outputs.commit }}
        run: |
          set -euo pipefail
          marker="$(node ./scripts/qa/fetch-exact.mjs "${STAGING_BASE_URL}/deploy-marker.json")"
          [ "$(jq -r '.commit // empty' <<<"$marker")" = "$EXPECTED_COMMIT" ]

      - name: Capture exact deployed App Service bytes
        id: capture-apps
        run: |
          set -euo pipefail
          capture_dir="${RUNNER_TEMP}/baseline-bundle"
          rm -rf "$capture_dir"
          mkdir -p "$capture_dir"
          capture_app() {
            local app="$1" destination="$2"
            local scm_host
            scm_host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$app" --query defaultHostName -o tsv | sed 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')"
            timeout 120s az rest \
              --method get \
              --url "https://${scm_host}/api/zip/site/wwwroot/" \
              --resource "https://management.azure.com/" \
              --output-file "$destination"
            unzip -t "$destination" >/dev/null
          }
          provisioner_health_before="$(node ./scripts/qa/fetch-exact.mjs "https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health")"
          provisioner_commit="$(jq -r '.build.commit // empty' <<<"$provisioner_health_before")"
          provisioner_payload="$(jq -r '.build.payloadSha256 // empty' <<<"$provisioner_health_before")"
          provisioner_configured_artifact="$(jq -r '.build.configuredArtifactSha256 // empty' <<<"$provisioner_health_before")"
          [ "$provisioner_commit" = "${{ steps.live.outputs.commit }}" ] || { echo "Provisioner health commit does not match the live marker."; exit 1; }
          [[ "$provisioner_payload" =~ ^[0-9a-f]{64}$ ]] || { echo "Provisioner health payload digest is invalid."; exit 1; }
          [[ "$provisioner_configured_artifact" =~ ^[0-9a-f]{64}$ ]] || { echo "Provisioner configured artifact digest is invalid."; exit 1; }
          capture_app "$JSS_PROVISIONER_APP_NAME" "$capture_dir/provisioner.zip"
          capture_app "$JSS_PROVISIONER_APP_NAME" /tmp/provisioner-confirm.zip
          provisioner_health_after="$(node ./scripts/qa/fetch-exact.mjs "https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health")"
          [ "$(jq -cS '.build' <<<"$provisioner_health_after")" = "$(jq -cS '.build' <<<"$provisioner_health_before")" ] || { echo "Provisioner build identity changed during capture."; exit 1; }
          relay_scm_host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$RELAY_APP_NAME" --query defaultHostName -o tsv | sed 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')"
          relay_deployment_before="$(timeout 30s az rest \
            --method get \
            --url "https://${relay_scm_host}/api/deployments/latest" \
            --resource "https://management.azure.com/" \
            --query '{id:id,status:status,active:active,complete:complete}' -o json)"
          relay_deployment_id="$(jq -r '.id // empty' <<<"$relay_deployment_before")"
          test -n "$relay_deployment_id"
          [ "$(jq -r '.status' <<<"$relay_deployment_before")" = "4" ]
          [ "$(jq -r '.active' <<<"$relay_deployment_before")" = "true" ]
          [ "$(jq -r '.complete' <<<"$relay_deployment_before")" = "true" ]
          capture_app "$RELAY_APP_NAME" "$capture_dir/relay.zip"
          relay_deployment_after="$(timeout 30s az rest \
            --method get \
            --url "https://${relay_scm_host}/api/deployments/latest" \
            --resource "https://management.azure.com/" \
            --query '{id:id,status:status,active:active,complete:complete}' -o json)"
          [ "$(jq -r '.id // empty' <<<"$relay_deployment_after")" = "$relay_deployment_id" ]
          [ "$(jq -r '.status' <<<"$relay_deployment_after")" = "4" ]
          [ "$(jq -r '.active' <<<"$relay_deployment_after")" = "true" ]
          [ "$(jq -r '.complete' <<<"$relay_deployment_after")" = "true" ]
          rm -rf /tmp/provisioner-live /tmp/provisioner-confirm /tmp/relay-live
          mkdir -p /tmp/provisioner-live /tmp/provisioner-confirm /tmp/relay-live/deploy
          unzip -q "$capture_dir/provisioner.zip" -d /tmp/provisioner-live
          unzip -q /tmp/provisioner-confirm.zip -d /tmp/provisioner-confirm
          unzip -q "$capture_dir/relay.zip" -d /tmp/relay-live/deploy
          (cd /tmp/provisioner-live && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$capture_dir/provisioner-files.sha256"
          (cd /tmp/provisioner-confirm && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/provisioner-confirm-files.sha256
          cmp --silent "$capture_dir/provisioner-files.sha256" /tmp/provisioner-confirm-files.sha256 || { echo "Provisioner live tree changed between captures."; exit 1; }
          (cd /tmp/relay-live/deploy && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$capture_dir/relay-files.sha256"
          [ "$(jq -r '.commit // empty' /tmp/provisioner-live/dist/build-info.json)" = "$provisioner_commit" ] || { echo "Captured provisioner commit does not match live health."; exit 1; }
          [ "$(jq -r '.payloadSha256 // empty' /tmp/provisioner-live/dist/build-info.json)" = "$provisioner_payload" ] || { echo "Captured provisioner payload identity does not match live health."; exit 1; }
          if [ -f /tmp/relay-live/deploy/build-info.json ]; then
            relay_provenance="embedded-build-info"
            relay_commit="$(jq -r '.commit // empty' /tmp/relay-live/deploy/build-info.json)"
            relay_payload="$(jq -r '.payloadSha256 // empty' /tmp/relay-live/deploy/build-info.json)"
            computed_relay_payload="$(node ./scripts/qa/hash-relay-payload.mjs /tmp/relay-live/deploy)"
            [ "$relay_commit" = "${{ steps.live.outputs.commit }}" ]
            [ "$relay_payload" = "$computed_relay_payload" ]
          else
            relay_provenance="kudu-deployment-tree"
            relay_commit=""
            relay_payload=""
          fi
          echo "provisioner_commit=$provisioner_commit" >> "$GITHUB_OUTPUT"
          echo "provisioner_payload=$provisioner_payload" >> "$GITHUB_OUTPUT"
          echo "provisioner_configured_artifact=$provisioner_configured_artifact" >> "$GITHUB_OUTPUT"
          echo "relay_provenance=$relay_provenance" >> "$GITHUB_OUTPUT"
          echo "relay_deployment_id=$relay_deployment_id" >> "$GITHUB_OUTPUT"
          echo "relay_commit=$relay_commit" >> "$GITHUB_OUTPUT"
          echo "relay_payload=$relay_payload" >> "$GITHUB_OUTPUT"

      - name: Checkout exact deployed source for PWA reconstruction
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.live.outputs.commit }}
          fetch-depth: 1
          path: deployed-source

      - name: Install exact deployed source dependencies
        working-directory: deployed-source
        run: pnpm install --frozen-lockfile

      - name: Verify backend captures survived source checkout
        run: |
          set -euo pipefail
          for file in provisioner.zip relay.zip provisioner-files.sha256 relay-files.sha256; do
            test -s "${RUNNER_TEMP}/baseline-bundle/${file}" || {
              echo "Captured backend file is missing after source checkout: ${file}"
              exit 1
            }
          done

      - name: Build strict staging PWA baseline
        working-directory: deployed-source
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_RELAY_URL: wss://nodezero-social-staging-testnet-relay.azurewebsites.net
          NZ_IDENTITY_CONTRACT_ID: CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K
          NZ_LOCKBOX_CONTRACT_ID: CB36LY5WZLJNMY4DHRXQER6LU3L4E5MGFYT2XSJG7ZJZV5SIIOKODT2H
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_FACTORY_VERSION: '3'
          NZ_ZK_ARTIFACTS_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/
          NZ_ZK_MANIFEST_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json
          NZ_NODEZERO_ISSUER_URL: https://solid.nodezero.social/
          NZ_NODEZERO_DIRECTORY_URL: https://api.nodezero.social/v1/community-directory/index
          NZ_APP_ORIGIN: https://staging.nodezero.social
          NZ_SEAMLESS_ONBOARDING_ENABLED: 'true'
          NZ_JSS_PROVISIONER_URL: https://api.nodezero.social
          NZ_BROWSER_SESSION_ENABLED: 'true'
          NZ_SOLID_BOOTSTRAP_ENABLED: 'true'
          NZ_MASHLIB_EXPLORER_ENABLED: 'true'
          NZ_MASHLIB_MODULE_ID: nodezero:mashlib-pane-provider
        run: |
          pnpm --filter @nodezero/mobile-app build:web
          pnpm pwa:validate:artifact

      - name: Capture and verify exact live PWA graph
        run: |
          set -euo pipefail
          live_pwa_dir="${RUNNER_TEMP}/baseline-pwa"
          rm -rf "$live_pwa_dir"
          mkdir -p "$live_pwa_dir"
          fetch_exact() {
            local path="$1" destination="$2" metadata status effective_url expected_url
            expected_url="${STAGING_BASE_URL}${path}"
            metadata="$(curl --silent --show-error --max-time 30 \
              --proto '=https' --tlsv1.2 --max-redirs 0 \
              --output "$destination" \
              --write-out '%{http_code}\n%{url_effective}' \
              "$expected_url")"
            status="$(sed -n '1p' <<<"$metadata")"
            effective_url="$(sed -n '2p' <<<"$metadata")"
            [ "$status" = "200" ] || { echo "Live PWA request returned HTTP ${status}: ${path}"; exit 1; }
            [ "$effective_url" = "$expected_url" ] || { echo "Live PWA request changed URL: ${path}"; exit 1; }
          }
          fetch_exact /service-worker.js /tmp/service-worker-first.js
          fetch_exact /service-worker.js /tmp/service-worker-second.js
          cmp --silent /tmp/service-worker-first.js /tmp/service-worker-second.js || {
            echo "Live service worker changed during baseline capture."
            exit 1
          }
          cp /tmp/service-worker-first.js "$live_pwa_dir/service-worker.js"
          LIVE_PWA_DIR="$live_pwa_dir" STAGING_BASE_URL="$STAGING_BASE_URL" node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { extractExpoAssetPaths } from './scripts/qa/extract-expo-assets.mjs'
          const worker = readFileSync(`${process.env.LIVE_PWA_DIR}/service-worker.js`, 'utf8')
          const match = worker.match(/const PRECACHE_URLS = (\[[\s\S]*?\]);/)
          if (!match) throw new Error('Live service worker is missing a JSON precache list.')
          const urls = JSON.parse(match[1])
          if (!Array.isArray(urls) || urls.length === 0 || new Set(urls).size !== urls.length) {
            throw new Error('Live service worker precache list must be a nonempty unique array.')
          }
          for (const url of urls) {
            if (typeof url !== 'string' || !/^\/[A-Za-z0-9._/-]+$/.test(url) || url.includes('..')) {
              throw new Error(`Unsafe live PWA precache path: ${String(url)}`)
            }
          }
          for (const required of ['/index.html', '/manifest.json', '/pwa-bootstrap.js']) {
            if (!urls.includes(required)) throw new Error(`Live PWA precache is missing ${required}.`)
          }
          const runtimeAssets = new Set()
          for (const url of urls.filter((value) => value.endsWith('.js'))) {
            const expectedUrl = `${process.env.STAGING_BASE_URL}${url}`
            const response = await fetch(expectedUrl, {
              headers: { 'cache-control': 'no-cache' },
              redirect: 'error',
            })
            if (!response.ok || response.url !== expectedUrl) {
              throw new Error(`Unable to inspect exact live PWA source ${url}: HTTP ${response.status}`)
            }
            const source = await response.text()
            for (const assetPath of extractExpoAssetPaths(source)) runtimeAssets.add(assetPath)
          }
          for (const asset of runtimeAssets) urls.push(asset)
          urls.sort()
          if (runtimeAssets.size === 0) throw new Error('Active Expo bundle exposed no runtime asset metadata.')
          for (const url of urls) {
            if (typeof url !== 'string' || !/^\/[A-Za-z0-9._@+~/-]+$/.test(url) || url.includes('..')) {
              throw new Error(`Unsafe live PWA graph path: ${String(url)}`)
            }
          }
          writeFileSync('/tmp/live-pwa-paths.txt', `${[...new Set(urls)].join('\n')}\n`)
          NODE
          while IFS= read -r asset_path; do
            relative="${asset_path#/}"
            destination="$live_pwa_dir/$relative"
            confirm="${RUNNER_TEMP}/pwa-confirm/$relative"
            mkdir -p "$(dirname "$destination")" "$(dirname "$confirm")"
            fetch_exact "$asset_path" "$destination"
            fetch_exact "$asset_path" "$confirm"
            cmp --silent "$destination" "$confirm" || {
              echo "Live PWA asset changed during baseline capture: ${asset_path}"
              exit 1
            }
          done < /tmp/live-pwa-paths.txt
          cp deployed-source/packages/mobile-app/dist/staticwebapp.config.json "$live_pwa_dir/staticwebapp.config.json"
          LIVE_PWA_DIR="$live_pwa_dir" node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync } from 'node:fs'
          import { join } from 'node:path'
          import { extractExpoAssetPaths } from './scripts/qa/extract-expo-assets.mjs'
          const root = process.env.LIVE_PWA_DIR
          const worker = readFileSync(join(root, 'service-worker.js'), 'utf8')
          const urls = JSON.parse(worker.match(/const PRECACHE_URLS = (\[[\s\S]*?\]);/)[1])
          const revision = createHash('sha256')
          for (const url of urls) {
            revision.update(url)
            revision.update(readFileSync(join(root, url.slice(1))))
          }
          const expected = `nodezero-pwa-staging-testnet-${revision.digest('hex').slice(0, 16)}`
          const actual = worker.match(/const CACHE_NAME = "([^"]+)";/)?.[1]
          if (actual !== expected) throw new Error(`Live PWA cache revision mismatch: ${String(actual)}`)
          const retainedPaths = new Set(
            readFileSync('/tmp/live-pwa-paths.txt', 'utf8').trim().split('\n')
          )
          for (const url of urls.filter((value) => value.endsWith('.js'))) {
            const source = readFileSync(join(root, url.slice(1)), 'utf8')
            for (const assetPath of extractExpoAssetPaths(source)) {
              if (!retainedPaths.has(assetPath)) {
                throw new Error(`Retained PWA is missing runtime asset ${assetPath}.`)
              }
            }
          }
          NODE

      - name: Build authenticated N-1 baseline manifest
        env:
          BASELINE_COMMIT: ${{ steps.live.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p baseline-bundle
          cp "${RUNNER_TEMP}/baseline-bundle/provisioner.zip" baseline-bundle/provisioner.zip
          cp "${RUNNER_TEMP}/baseline-bundle/relay.zip" baseline-bundle/relay.zip
          cp "${RUNNER_TEMP}/baseline-bundle/provisioner-files.sha256" baseline-bundle/provisioner-files.sha256
          cp "${RUNNER_TEMP}/baseline-bundle/relay-files.sha256" baseline-bundle/relay-files.sha256
          cp -r "${RUNNER_TEMP}/baseline-pwa" baseline-bundle/pwa-dist
          (cd baseline-bundle/pwa-dist && find . -type f ! -name deploy-marker.json ! -name staticwebapp.config.json -print0 | sort -z | xargs -0 sha256sum) > baseline-bundle/pwa-files.sha256
          provisioner_sha="$(sha256sum baseline-bundle/provisioner.zip | awk '{print $1}')"
          pwa_sha="$(sha256sum baseline-bundle/pwa-files.sha256 | awk '{print $1}')"
          relay_sha="$(sha256sum baseline-bundle/relay.zip | awk '{print $1}')"
          cat > baseline-bundle/manifest.json <<EOF
          {
            "version": 1,
            "kind": "staging-n-1-baseline",
            "environment": "staging-testnet",
            "commit": "${BASELINE_COMMIT}",
            "captureToolingCommit": "${GITHUB_SHA}",
            "capturedByRunId": "${GITHUB_RUN_ID}",
            "capturedByRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "liveMarkerRunId": "$(jq -r '.runId' /tmp/live-marker.json)",
            "liveMarkerRunAttempt": "$(jq -r '.runAttempt' /tmp/live-marker.json)",
            "components": {
              "provisioner": {
                "provenance": "authenticated-live-tree",
                "commit": "${{ steps.capture-apps.outputs.provisioner_commit }}",
                "payloadSha256": "${{ steps.capture-apps.outputs.provisioner_payload }}",
                "configuredArtifactSha256": "${{ steps.capture-apps.outputs.provisioner_configured_artifact }}"
              },
              "relay": {
                "provenance": "${{ steps.capture-apps.outputs.relay_provenance }}",
                "kuduDeploymentId": "${{ steps.capture-apps.outputs.relay_deployment_id }}",
                "commit": "${{ steps.capture-apps.outputs.relay_commit }}",
                "payloadSha256": "${{ steps.capture-apps.outputs.relay_payload }}"
              }
            },
            "qFlags": {
              "directory": false,
              "peerProfile": false,
              "relationship": false,
              "transport": false
            },
            "sha256": {
              "provisionerZip": "${provisioner_sha}",
              "relayZip": "${relay_sha}",
              "pwaTree": "${pwa_sha}",
              "provisionerTree": "$(sha256sum baseline-bundle/provisioner-files.sha256 | awk '{print $1}')",
              "relayTree": "$(sha256sum baseline-bundle/relay-files.sha256 | awk '{print $1}')"
            }
          }
          EOF

      - name: Upload authenticated N-1 baseline bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-baseline-${{ steps.live.outputs.commit }}
          path: baseline-bundle
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
