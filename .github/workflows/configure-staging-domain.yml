name: Configure Staging Domain

on:
  workflow_dispatch:
    inputs:
      dns_mode:
        description: DNS management mode
        required: true
        default: namecheap
        type: choice
        options:
          - namecheap
          - preconfigured
      namecheap_api_user:
        description: Namecheap API user/account username
        required: false
        type: string
      namecheap_username:
        description: Namecheap username if different from API user
        required: false
        type: string
      namecheap_client_ip:
        description: Namecheap API ClientIp override, if API access is allowlisted to a known IP
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  configure-domain:
    name: Configure staging.nodezero.social
    runs-on: ubuntu-latest
    environment: staging-testnet

    env:
      STATIC_WEB_APP_NAME: nodezero-social-staging-testnet-web
      STAGING_CUSTOM_DOMAIN: staging.nodezero.social
      AZURE_CLIENT_ID: 52120dbe-2b66-4e12-bdad-9f872a3ae845
      AZURE_TENANT_ID: bab5056b-732f-4710-a7b9-e9c5807cd6f9
      AZURE_SUBSCRIPTION_ID: 1f002267-9614-4a2a-a0e0-217493d6d011
      AZURE_RESOURCE_GROUP: rg-nodezero-social-staging-testnet
      NAMECHEAP_DOMAIN: nodezero.social
      NAMECHEAP_HOST: staging
      NAMECHEAP_API_KEY: ${{ secrets.NAMECHEAP_API_KEY }}
      NAMECHEAP_API_USER: ${{ inputs.namecheap_api_user || vars.NAMECHEAP_API_USER || secrets.NAMECHEAP_API_USER }}
      NAMECHEAP_USERNAME: ${{ inputs.namecheap_username || inputs.namecheap_api_user || vars.NAMECHEAP_USERNAME || secrets.NAMECHEAP_USERNAME || vars.NAMECHEAP_API_USER || secrets.NAMECHEAP_API_USER }}
      NAMECHEAP_CLIENT_IP: ${{ inputs.namecheap_client_ip || vars.NAMECHEAP_CLIENT_IP || secrets.NAMECHEAP_CLIENT_IP }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Static Web Apps default hostname
        id: swa
        run: |
          hostname="$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostname -o tsv)"
          if [ -z "$hostname" ]; then
            echo "Unable to resolve Static Web Apps default hostname."
            exit 1
          fi
          echo "hostname=$hostname" >> "$GITHUB_OUTPUT"

      - name: Print DNS cutover values
        run: |
          echo "Static Web App CNAME target: ${{ steps.swa.outputs.hostname }}"
          echo "Namecheap record: staging.nodezero.social CNAME ${{ steps.swa.outputs.hostname }}"
          echo "Azure DNS delegation option for nodezero.social:"
          az network dns zone show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name nodezero.social \
            --query nameServers \
            -o tsv || true

      - name: Validate Namecheap credential inputs
        if: ${{ inputs.dns_mode == 'namecheap' }}
        run: |
          if [ -z "$NAMECHEAP_API_KEY" ]; then
            echo "NAMECHEAP_API_KEY GitHub secret is required."
            exit 1
          fi
          if [ -z "$NAMECHEAP_API_USER" ] || [ -z "$NAMECHEAP_USERNAME" ]; then
            echo "NAMECHEAP_API_USER / NAMECHEAP_USERNAME is required."
            echo "Provide workflow input namecheap_api_user or set repo variable/secret NAMECHEAP_API_USER."
            exit 1
          fi

      - name: Configure Namecheap CNAME
        if: ${{ inputs.dns_mode == 'namecheap' }}
        env:
          NAMECHEAP_TARGET: ${{ steps.swa.outputs.hostname }}
        run: node scripts/dns/configure-namecheap-staging-domain.mjs

      - name: Verify preconfigured DNS
        if: ${{ inputs.dns_mode == 'preconfigured' }}
        run: |
          expected="${{ steps.swa.outputs.hostname }}"
          observed="$(dig +short CNAME "$STAGING_CUSTOM_DOMAIN" | sed 's/\.$//' | head -n1)"
          if [ "$observed" != "$expected" ]; then
            echo "$STAGING_CUSTOM_DOMAIN must be a CNAME to $expected before Azure can bind the hostname."
            echo "Observed CNAME: ${observed:-<none>}"
            exit 1
          fi

      - name: Bind custom hostname in Azure Static Web Apps
        run: |
          for attempt in $(seq 1 30); do
            if az staticwebapp hostname set \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --hostname "$STAGING_CUSTOM_DOMAIN" \
              --validation-method cname-delegation; then
              exit 0
            fi
            echo "Azure hostname validation not ready yet ($attempt/30). Waiting for DNS propagation..."
            sleep 30
          done
          echo "Azure Static Web Apps custom hostname binding failed after waiting for DNS propagation."
          exit 1

      - name: Validate custom hostname smoke suite
        env:
          STAGING_BASE_URL: https://${{ env.STAGING_CUSTOM_DOMAIN }}
        run: bash ./scripts/qa/staging-smoke.sh

      - name: Domain summary
        run: echo "staging.nodezero.social DNS, Azure custom domain, TLS, and smoke checks completed."
