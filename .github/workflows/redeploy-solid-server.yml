name: Redeploy Solid Server

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: Target environment profile
        required: true
        default: staging-testnet
        type: choice
        options:
          - staging-testnet
          - testnet
      resource_group:
        description: Azure resource group name
        required: true
        default: rg-nodezero-social-staging-testnet
        type: string
      parameters_file:
        description: Bicep parameters file path
        required: true
        default: infrastructure/azure/solid-server.parameters.staging-testnet.json
        type: string
      css_image:
        description: Optional custom Community Solid Server image override
        required: false
        type: string
      css_image_registry_server:
        description: Optional registry server for private css_image pulls
        required: false
        type: string
      css_image_registry_username:
        description: Optional registry username for private css_image pulls
        required: false
        type: string
      css_image_registry_password_secret_name:
        description: GitHub environment secret name containing private registry password/token
        required: false
        default: SOLID_CSS_IMAGE_REGISTRY_PASSWORD
        type: string
      css_config_arg:
        description: Optional CSS -c override
        required: false
        type: string
      css_data_path:
        description: Optional CSS -f override (absolute Linux path)
        required: false
        type: string
      css_extra_args_json:
        description: Optional JSON array string for extra CSS args
        required: false
        type: string
      email_provider_mode:
        description: Email provider mode for CSS notifications (none or smtp)
        required: false
        default: smtp
        type: choice
        options:
          - none
          - smtp
      email_from_address:
        description: From email address for CSS auth/security notifications
        required: false
        default: admin@nodezero.social
        type: string
      email_from_name:
        description: From display name for CSS auth/security notifications
        required: false
        default: Node Zero Security
        type: string
      smtp_host:
        description: SMTP host (used when email_provider_mode=smtp)
        required: false
        default: smtp.azurecomm.net
        type: string
      smtp_port:
        description: SMTP port (used when email_provider_mode=smtp)
        required: false
        default: "587"
        type: string
      smtp_starttls:
        description: Use STARTTLS for SMTP
        required: false
        default: true
        type: boolean
      smtp_username_secret_name:
        description: GitHub environment secret name containing SMTP username
        required: false
        default: SOLID_SMTP_USERNAME
        type: string
      smtp_password_secret_name:
        description: GitHub environment secret name containing SMTP password
        required: false
        default: SOLID_SMTP_PASSWORD
        type: string
      dns_autofix:
        description: Auto-correct DNS CNAME when custom host is used
        required: true
        default: false
        type: boolean
      dns_zone_name:
        description: DNS zone (required when dns_autofix is true)
        required: false
        type: string
      dns_resource_group:
        description: DNS resource group override
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  redeploy-solid:
    name: Redeploy Solid server (idempotent)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}

    env:
      AZURE_CLIENT_ID: 52120dbe-2b66-4e12-bdad-9f872a3ae845
      AZURE_TENANT_ID: bab5056b-732f-4710-a7b9-e9c5807cd6f9
      AZURE_SUBSCRIPTION_ID: 1f002267-9614-4a2a-a0e0-217493d6d011

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.1.0

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Validate environment isolation policy
        run: corepack pnpm policy:validate-env

      - name: Run idempotent Solid redeploy
        env:
          AZURE_RESOURCE_GROUP: ${{ inputs.resource_group }}
          AZURE_BICEP_PARAMETERS_FILE: ${{ inputs.parameters_file }}
          AZURE_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          AZURE_SOLID_CSS_IMAGE: ${{ inputs.css_image }}
          AZURE_SOLID_CSS_IMAGE_REGISTRY_SERVER: ${{ inputs.css_image_registry_server }}
          AZURE_SOLID_CSS_IMAGE_REGISTRY_USERNAME: ${{ inputs.css_image_registry_username }}
          AZURE_SOLID_CSS_IMAGE_REGISTRY_PASSWORD: ${{ secrets[inputs.css_image_registry_password_secret_name] }}
          AZURE_CSS_CONFIG_ARG: ${{ inputs.css_config_arg }}
          AZURE_CSS_DATA_PATH: ${{ inputs.css_data_path }}
          AZURE_CSS_EXTRA_ARGS_JSON: ${{ inputs.css_extra_args_json }}
          AZURE_SOLID_EMAIL_PROVIDER_MODE: ${{ inputs.email_provider_mode }}
          AZURE_SOLID_EMAIL_FROM_ADDRESS: ${{ inputs.email_from_address }}
          AZURE_SOLID_EMAIL_FROM_NAME: ${{ inputs.email_from_name }}
          AZURE_SOLID_SMTP_HOST: ${{ inputs.smtp_host }}
          AZURE_SOLID_SMTP_PORT: ${{ inputs.smtp_port }}
          AZURE_SOLID_SMTP_STARTTLS: ${{ inputs.smtp_starttls }}
          AZURE_SOLID_SMTP_USERNAME: ${{ secrets[inputs.smtp_username_secret_name] }}
          AZURE_SOLID_SMTP_PASSWORD: ${{ secrets[inputs.smtp_password_secret_name] }}
          AZURE_SOLID_DNS_AUTOFIX: ${{ inputs.dns_autofix }}
          AZURE_SOLID_DNS_ZONE_NAME: ${{ inputs.dns_zone_name }}
          AZURE_SOLID_DNS_RESOURCE_GROUP: ${{ inputs.dns_resource_group }}
        run: |
          chmod +x scripts/azure/deploy-solid-server.sh
          chmod +x scripts/azure/redeploy-solid-server.sh
          bash ./scripts/azure/redeploy-solid-server.sh

      - name: Redeploy summary
        run: echo "Solid server redeploy workflow completed."
