name: Staging Rollback

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful staging-deploy run containing the retained rollback bundle
        required: true
        type: string
      expected_commit:
        description: Exact commit SHA recorded in the retained bundle
        required: true
        type: string
      source_run_attempt:
        description: Exact successful staging-deploy run attempt that produced the bundle
        required: true
        type: string
      source_kind:
        description: Artifact source workflow
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - deployment
      source_tooling_commit:
        description: Capture workflow head SHA for baseline sources; same as expected commit for deployment sources
        required: true
        type: string
      confirm_staging_testnet:
        description: Confirm this rollback targets staging-testnet only
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-testnet-deploy
  cancel-in-progress: false

jobs:
  rollback-staging:
    name: Roll back staging-testnet
    if: ${{ inputs.confirm_staging_testnet == true }}
    runs-on: ubuntu-latest
    environment: staging-testnet

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: rg-nodezero-social-staging-testnet
      STATIC_WEB_APP_NAME: nodezero-social-staging-testnet-web
      JSS_PROVISIONER_APP_NAME: nodezero-social-staging-testnet-provisioner
      RELAY_APP_NAME: nodezero-social-staging-testnet-relay

    steps:
      - name: Checkout rollback tooling
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download retained rollback bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.source_kind == 'baseline' && format('staging-baseline-{0}', inputs.expected_commit) || format('staging-rollback-{0}-{1}', inputs.expected_commit, inputs.source_run_attempt) }}
          path: rollback-bundle
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate source staging-deploy run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_TOOLING_COMMIT: ${{ inputs.source_tooling_commit }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$(jq -r '.workflow_id' <<<"$run_json")")"
          if [ "$SOURCE_KIND" = "baseline" ]; then
            workflow_path="$(jq -r '.path' <<<"$workflow_json")"
            workflow_name="$(jq -r '.name' <<<"$workflow_json")"
            if [ "$workflow_path" = ".github/workflows/staging-baseline-capture.yml" ]; then
              [ "$workflow_name" = "Capture Staging Baseline" ]
            else
              [ "$workflow_path" = ".github/workflows/staging-deploy.yml" ]
              [ "$workflow_name" = "Staging Deploy" ]
              [ "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch" ]
            fi
          else
            [ "$(jq -r '.path' <<<"$workflow_json")" = ".github/workflows/staging-deploy.yml" ]
            [ "$(jq -r '.name' <<<"$workflow_json")" = "Staging Deploy" ]
          fi
          [ "$(jq -r '.conclusion' <<<"$run_json")" = "success" ]
          [ "$(jq -r '.head_branch' <<<"$run_json")" = "testnet" ]
          [ "$(jq -r '.head_sha' <<<"$run_json")" = "$SOURCE_TOOLING_COMMIT" ]
          if [ "$SOURCE_KIND" = "deployment" ]; then
            [ "$SOURCE_TOOLING_COMMIT" = "$EXPECTED_COMMIT" ]
          fi
          [ "$(jq -r '.run_attempt' <<<"$run_json")" = "$EXPECTED_ATTEMPT" ]
          event="$(jq -r '.event' <<<"$run_json")"
          [ "$event" = "push" ] || [ "$event" = "workflow_dispatch" ]

      - name: Validate rollback bundle provenance and digests
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_SOURCE_RUN: ${{ inputs.source_run_id }}
          EXPECTED_SOURCE_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_KIND: ${{ inputs.source_kind }}
          SOURCE_TOOLING_COMMIT: ${{ inputs.source_tooling_commit }}
        run: |
          set -euo pipefail
          manifest=rollback-bundle/manifest.json
          test -f "$manifest"
          [ "$(jq -r '.version' "$manifest")" = "1" ]
          [ "$(jq -r '.environment' "$manifest")" = "staging-testnet" ]
          [ "$(jq -r '.commit' "$manifest")" = "$EXPECTED_COMMIT" ]
          if [ "$SOURCE_KIND" = "baseline" ]; then
            [ "$(jq -r '.kind' "$manifest")" = "staging-n-1-baseline" ]
            [ "$(jq -r '.captureToolingCommit' "$manifest")" = "$SOURCE_TOOLING_COMMIT" ]
            [ "$(jq -r '.capturedByRunId' "$manifest")" = "$EXPECTED_SOURCE_RUN" ]
            [ "$(jq -r '.capturedByRunAttempt' "$manifest")" = "$EXPECTED_SOURCE_ATTEMPT" ]
          else
            [ "$(jq -r '.sourceRunId' "$manifest")" = "$EXPECTED_SOURCE_RUN" ]
            [ "$(jq -r '.sourceRunAttempt' "$manifest")" = "$EXPECTED_SOURCE_ATTEMPT" ]
          fi
          for flag in directory peerProfile relationship transport; do
            [ "$(jq -r ".qFlags.${flag}" "$manifest")" = "false" ]
          done
          expected_provisioner_sha="$(jq -r '.sha256.provisionerZip // empty' "$manifest")"
          expected_provisioner_tree="$(jq -r '.sha256.provisionerTree // empty' "$manifest")"
          [[ "$expected_provisioner_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_provisioner_tree" =~ ^[0-9a-f]{64}$ ]]
          test -f rollback-bundle/provisioner.zip
          test -f rollback-bundle/provisioner-files.sha256
          [ "$(sha256sum rollback-bundle/provisioner.zip | awk '{print $1}')" = "$expected_provisioner_sha" ]
          [ "$(sha256sum rollback-bundle/provisioner-files.sha256 | awk '{print $1}')" = "$expected_provisioner_tree" ]
          rm -rf /tmp/retained-provisioner
          mkdir -p /tmp/retained-provisioner
          unzip -q rollback-bundle/provisioner.zip -d /tmp/retained-provisioner
          (cd /tmp/retained-provisioner && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/retained-provisioner-files.sha256
          cmp --silent rollback-bundle/provisioner-files.sha256 /tmp/retained-provisioner-files.sha256
          provisioner_provenance="$(jq -r '.components.provisioner.provenance // empty' "$manifest")"
          provisioner_payload="$(jq -r '.components.provisioner.payloadSha256 // empty' "$manifest")"
          provisioner_configured_artifact="$(jq -r '.components.provisioner.configuredArtifactSha256 // empty' "$manifest")"
          [[ "$provisioner_payload" =~ ^[0-9a-f]{64}$ ]]
          [[ "$provisioner_configured_artifact" =~ ^[0-9a-f]{64}$ ]]
          [ "$(jq -r '.components.provisioner.commit // empty' "$manifest")" = "$EXPECTED_COMMIT" ]
          [ "$(jq -r '.commit // empty' /tmp/retained-provisioner/dist/build-info.json)" = "$EXPECTED_COMMIT" ]
          [ "$(jq -r '.payloadSha256 // empty' /tmp/retained-provisioner/dist/build-info.json)" = "$provisioner_payload" ]
          if [ "$SOURCE_KIND" = "baseline" ]; then
            [ "$provisioner_provenance" = "authenticated-live-tree" ]
          else
            [ "$provisioner_provenance" = "embedded-build-info" ]
            [ "$provisioner_configured_artifact" = "$expected_provisioner_sha" ]
          fi
          expected_relay_sha="$(jq -r '.sha256.relayZip // empty' "$manifest")"
          expected_relay_tree="$(jq -r '.sha256.relayTree // empty' "$manifest")"
          [[ "$expected_relay_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$expected_relay_tree" =~ ^[0-9a-f]{64}$ ]]
          test -f rollback-bundle/relay.zip
          test -f rollback-bundle/relay-files.sha256
          [ "$(sha256sum rollback-bundle/relay.zip | awk '{print $1}')" = "$expected_relay_sha" ]
          [ "$(sha256sum rollback-bundle/relay-files.sha256 | awk '{print $1}')" = "$expected_relay_tree" ]
          rm -rf /tmp/retained-relay
          mkdir -p /tmp/retained-relay/deploy
          unzip -q rollback-bundle/relay.zip -d /tmp/retained-relay/deploy
          (cd /tmp/retained-relay/deploy && sha256sum --check "$GITHUB_WORKSPACE/rollback-bundle/relay-files.sha256")
          relay_provenance="$(jq -r '.components.relay.provenance // empty' "$manifest")"
          if [ "$SOURCE_KIND" = "baseline" ] && [ "$relay_provenance" = "kudu-deployment-tree" ]; then
            test ! -f /tmp/retained-relay/deploy/build-info.json
            test -n "$(jq -r '.components.relay.kuduDeploymentId // empty' "$manifest")"
            [ -z "$(jq -r '.components.relay.commit // empty' "$manifest")" ]
            [ -z "$(jq -r '.components.relay.payloadSha256 // empty' "$manifest")" ]
          elif [ "$relay_provenance" = "embedded-build-info" ]; then
            test -f /tmp/retained-relay/deploy/build-info.json
            relay_payload="$(node ./scripts/qa/hash-relay-payload.mjs /tmp/retained-relay/deploy)"
            [ "$(jq -r '.commit' /tmp/retained-relay/deploy/build-info.json)" = "$EXPECTED_COMMIT" ]
            [ "$(jq -r '.payloadSha256' /tmp/retained-relay/deploy/build-info.json)" = "$relay_payload" ]
            [ "$(jq -r '.components.relay.commit' "$manifest")" = "$EXPECTED_COMMIT" ]
            [ "$(jq -r '.components.relay.payloadSha256' "$manifest")" = "$relay_payload" ]
          else
            echo "Unsupported baseline relay provenance: $relay_provenance"
            exit 1
          fi
          while read -r _ relative_path; do
            test -f "rollback-bundle/pwa-dist/${relative_path#./}" || {
              echo "Rollback artifact is missing checksummed PWA file: ${relative_path}"
              exit 1
            }
          done < rollback-bundle/pwa-files.sha256
          (cd rollback-bundle/pwa-dist && sha256sum --check ../pwa-files.sha256)
          pwa_sha="$(cd rollback-bundle/pwa-dist && find . -type f ! -name deploy-marker.json ! -name staticwebapp.config.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          [ "$pwa_sha" = "$(jq -r '.sha256.pwaTree' "$manifest")" ]

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Force Milestone Q flags off
        id: force-dark
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -euo pipefail
          provisioner_artifact_sha="$(sha256sum rollback-bundle/provisioner.zip | awk '{print $1}')"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --settings \
              JSS_BUILD_COMMIT="$EXPECTED_COMMIT" \
              JSS_BUILD_ARTIFACT_SHA256="$provisioner_artifact_sha" \
              JSS_Q_DIRECTORY_ENABLED=false \
              JSS_Q_PEER_PROFILE_ENABLED=false \
              JSS_Q_RELATIONSHIP_ENABLED=false \
              JSS_Q_TRANSPORT_ENABLED=false \
            --output none

      - name: Redeploy retained provisioner artifact
        id: deploy-provisioner
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --src-path rollback-bundle/provisioner.zip \
            --type zip \
            --clean true

      - name: Verify retained provisioner provenance and dark state
        id: verify-provisioner
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        run: |
          set -euo pipefail
          manifest=rollback-bundle/manifest.json
          expected_payload="$(unzip -p rollback-bundle/provisioner.zip dist/build-info.json | jq -r '.payloadSha256')"
          expected_artifact="$(jq -r '.sha256.provisionerZip' "$manifest")"
          for attempt in {1..30}; do
            health="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health" || true)"
            q_health_ok=true
            if [ "$SOURCE_KIND" = "deployment" ]; then
              [ "$(jq -r '.communityDirectory.backend // empty' <<<"$health")" = "table" ] || q_health_ok=false
              [ "$(jq -r '.communityDirectory.ready // false' <<<"$health")" = "true" ] || q_health_ok=false
              [ "$(jq -r '.transportIdentity.ready // false' <<<"$health")" = "true" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags.directory // true' <<<"$health")" = "false" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags["peer-profile"] // true' <<<"$health")" = "false" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags.relationship // true' <<<"$health")" = "false" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags.transport // true' <<<"$health")" = "false" ] || q_health_ok=false
            fi
            if [ "$(jq -r '.build.commit // empty' <<<"$health")" = "$EXPECTED_COMMIT" ] && \
               [ "$(jq -r '.build.payloadSha256 // empty' <<<"$health")" = "$expected_payload" ] && \
               [ "$(jq -r '.build.configuredArtifactSha256 // empty' <<<"$health")" = "$expected_artifact" ] && \
               [ "$q_health_ok" = "true" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Retained provisioner provenance verification failed."
          exit 1

      - name: Redeploy retained relay artifact
        id: deploy-relay
        run: |
          set -euo pipefail
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$RELAY_APP_NAME" \
            --src-path rollback-bundle/relay.zip \
            --type zip \
            --clean true

      - name: Verify retained relay provenance and dark state
        id: verify-relay
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        run: |
          set -euo pipefail
          relay_provenance="$(jq -r '.components.relay.provenance // empty' rollback-bundle/manifest.json)"
          if [ "$relay_provenance" = "kudu-deployment-tree" ]; then
            [ "$SOURCE_KIND" = "baseline" ]
            test -f rollback-bundle/relay-files.sha256
            scm_host="$(az webapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "$RELAY_APP_NAME" --query defaultHostName -o tsv | sed 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')"
            timeout 120s az rest \
              --method get \
              --url "https://${scm_host}/api/zip/site/wwwroot/" \
              --resource "https://management.azure.com/" \
              --output-file /tmp/live-relay.zip
            rm -rf /tmp/live-relay
            mkdir -p /tmp/live-relay
            unzip -q /tmp/live-relay.zip -d /tmp/live-relay
            (cd /tmp/live-relay && find . -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/live-relay-files.sha256
            cmp --silent "$GITHUB_WORKSPACE/rollback-bundle/relay-files.sha256" /tmp/live-relay-files.sha256
            for attempt in {1..30}; do
              health="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${RELAY_APP_NAME}.azurewebsites.net/health" || true)"
              if [ "$(jq -r '.ok // false' <<<"$health")" = "true" ] && \
                 [ "$(jq -r '.service // empty' <<<"$health")" = "relay-service" ]; then
                exit 0
              fi
              sleep 10
            done
            echo "Legacy retained relay bytes matched, but the service did not become healthy."
            exit 1
          fi
          [ "$relay_provenance" = "embedded-build-info" ]
          expected_payload="$(unzip -p rollback-bundle/relay.zip build-info.json | jq -r '.payloadSha256')"
          for attempt in {1..30}; do
            health="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${RELAY_APP_NAME}.azurewebsites.net/health" || true)"
            if [ "$(jq -r '.build.commit // empty' <<<"$health")" = "$EXPECTED_COMMIT" ] && \
               [ "$(jq -r '.build.payloadSha256 // empty' <<<"$health")" = "$expected_payload" ] && \
               [ "$(jq -r '.identityVerifierReachable // false' <<<"$health")" = "true" ] && \
               [ "$(jq -r '.transportEnabled // true' <<<"$health")" = "false" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Retained relay provenance verification failed."
          exit 1

      - name: Publish retained PWA artifact
        id: swa-token
        run: |
          set -euo pipefail
          token="$(az staticwebapp secrets list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Stamp rollback PWA marker
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          pwa_content_sha="$(jq -r '.sha256.pwaTree' rollback-bundle/manifest.json)"
          cat > rollback-bundle/pwa-dist/deploy-marker.json <<EOF
          {
            "environment": "staging-testnet",
            "workflow": "staging-rollback",
            "commit": "${EXPECTED_COMMIT}",
            "sourceRunId": "${SOURCE_RUN_ID}",
            "sourceRunAttempt": "${SOURCE_RUN_ATTEMPT}",
            "pwaContentSha256": "${pwa_content_sha}",
            "rollbackRunId": "${GITHUB_RUN_ID}",
            "rollbackRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "generatedAtUtc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload retained PWA
        id: deploy-pwa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: rollback-bundle/pwa-dist
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Verify rollback provenance and dark rollout state
        id: verify-rollback
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          SOURCE_KIND: ${{ inputs.source_kind }}
        run: |
          set -euo pipefail
          manifest=rollback-bundle/manifest.json
          expected_provisioner_payload="$(unzip -p rollback-bundle/provisioner.zip dist/build-info.json | jq -r '.payloadSha256')"
          expected_relay_payload=""
          relay_provenance="$(jq -r '.components.relay.provenance // empty' "$manifest")"
          test -f rollback-bundle/relay.zip
          if [ "$relay_provenance" = "embedded-build-info" ]; then
            expected_relay_payload="$(unzip -p rollback-bundle/relay.zip build-info.json | jq -r '.payloadSha256')"
          elif [ "$relay_provenance" != "kudu-deployment-tree" ]; then
            echo "Unsupported relay provenance: $relay_provenance"
            exit 1
          fi
          expected_artifact="$(jq -r '.sha256.provisionerZip' "$manifest")"
          expected_pwa_sha="$(jq -r '.sha256.pwaTree' "$manifest")"
          for attempt in {1..30}; do
            provisioner_json="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health" || true)"
            relay_json="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${RELAY_APP_NAME}.azurewebsites.net/health" || true)"
            marker_json="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs https://staging.nodezero.social/deploy-marker.json || true)"
            relay_ok=true
            if [ "$relay_provenance" = "kudu-deployment-tree" ]; then
              [ "${{ steps.verify-relay.outcome }}" = "success" ] || relay_ok=false
              [ "$(jq -r '.ok // false' <<<"$relay_json")" = "true" ] || relay_ok=false
              [ "$(jq -r '.service // empty' <<<"$relay_json")" = "relay-service" ] || relay_ok=false
            else
              [ "$(jq -r '.build.commit // empty' <<<"$relay_json")" = "$EXPECTED_COMMIT" ] || relay_ok=false
              [ "$(jq -r '.build.payloadSha256 // empty' <<<"$relay_json")" = "$expected_relay_payload" ] || relay_ok=false
              [ "$(jq -r '.identityVerifierReachable // false' <<<"$relay_json")" = "true" ] || relay_ok=false
              [ "$(jq -r '.transportEnabled // true' <<<"$relay_json")" = "false" ] || relay_ok=false
            fi
            q_health_ok=true
            if [ "$SOURCE_KIND" = "deployment" ]; then
              [ "$(jq -r '.milestoneQ.flags.directory // true' <<<"$provisioner_json")" = "false" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags["peer-profile"] // true' <<<"$provisioner_json")" = "false" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags.relationship // true' <<<"$provisioner_json")" = "false" ] || q_health_ok=false
              [ "$(jq -r '.milestoneQ.flags.transport // true' <<<"$provisioner_json")" = "false" ] || q_health_ok=false
            fi
            live_settings="$(az webapp config appsettings list --resource-group "$AZURE_RESOURCE_GROUP" --name "$JSS_PROVISIONER_APP_NAME" -o json)"
            settings_dark=true
            for setting in JSS_Q_DIRECTORY_ENABLED JSS_Q_PEER_PROFILE_ENABLED JSS_Q_RELATIONSHIP_ENABLED JSS_Q_TRANSPORT_ENABLED; do
              [ "$(jq -r --arg setting "$setting" '.[] | select(.name == $setting) | .value' <<<"$live_settings")" = "false" ] || settings_dark=false
            done
            if [ "$(jq -r '.build.commit // empty' <<<"$provisioner_json")" = "$EXPECTED_COMMIT" ] && \
              [ "$(jq -r '.build.payloadSha256 // empty' <<<"$provisioner_json")" = "$expected_provisioner_payload" ] && \
              [ "$(jq -r '.build.configuredArtifactSha256 // empty' <<<"$provisioner_json")" = "$expected_artifact" ] && \
              [ "$relay_ok" = "true" ] && \
              [ "$q_health_ok" = "true" ] && \
              [ "$settings_dark" = "true" ] && \
               [ "$(jq -r '.commit // empty' <<<"$marker_json")" = "$EXPECTED_COMMIT" ] && \
              [ "$(jq -r '.environment // empty' <<<"$marker_json")" = "staging-testnet" ] && \
              [ "$(jq -r '.workflow // empty' <<<"$marker_json")" = "staging-rollback" ] && \
              [ "$(jq -r '.sourceRunId // empty' <<<"$marker_json")" = "$SOURCE_RUN_ID" ] && \
               [ "$(jq -r '.sourceRunAttempt // empty' <<<"$marker_json")" = "$SOURCE_RUN_ATTEMPT" ] && \
               [ "$(jq -r '.pwaContentSha256 // empty' <<<"$marker_json")" = "$expected_pwa_sha" ]; then
              NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs https://staging.nodezero.social/deploy-marker.json /tmp/live-rollback-marker.json
              deployed_marker_sha="$(sha256sum /tmp/live-rollback-marker.json | awk '{print $1}')"
              local_marker_sha="$(sha256sum rollback-bundle/pwa-dist/deploy-marker.json | awk '{print $1}')"
              [ "$deployed_marker_sha" = "$local_marker_sha" ]
              while read -r expected_hash relative_path; do
                asset_path="${relative_path#./}"
                NZ_FETCH_TIMEOUT_MS=20000 node ./scripts/qa/fetch-exact.mjs "https://staging.nodezero.social/${asset_path}" /tmp/live-rollback-asset
                deployed_hash="$(sha256sum /tmp/live-rollback-asset | awk '{print $1}')"
                [ "$deployed_hash" = "$expected_hash" ]
              done < rollback-bundle/pwa-files.sha256
              [ "$(sha256sum rollback-bundle/pwa-files.sha256 | awk '{print $1}')" = "$expected_pwa_sha" ]
              exit 0
            fi
            sleep 10
          done
          echo "Rollback provenance or dark rollout verification failed."
          exit 1

      - name: Report final rollback component state
        if: ${{ always() }}
        run: |
          provisioner_health="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health" || true)"
          relay_health="$(NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "https://${RELAY_APP_NAME}.azurewebsites.net/health" || true)"
          cat <<EOF
          Force dark flags:      ${{ steps.force-dark.outcome }}
          Provisioner deploy:  ${{ steps.deploy-provisioner.outcome }}
          Provisioner verify:  ${{ steps.verify-provisioner.outcome }}
          Relay deploy:        ${{ steps.deploy-relay.outcome }}
          Relay verify:        ${{ steps.verify-relay.outcome }}
          PWA deploy:          ${{ steps.deploy-pwa.outcome }}
          Final verification:  ${{ steps.verify-rollback.outcome }}
          Live directory flag: $(jq -r '.milestoneQ.flags.directory // "unknown"' <<<"$provisioner_health")
          Live peer flag:      $(jq -r '.milestoneQ.flags["peer-profile"] // "unknown"' <<<"$provisioner_health")
          Live relationship:   $(jq -r '.milestoneQ.flags.relationship // "unknown"' <<<"$provisioner_health")
          Live transport flag: $(jq -r '.milestoneQ.flags.transport // "unknown"' <<<"$provisioner_health")
          Relay transport:     $(jq -r '.transportEnabled // "unknown"' <<<"$relay_health")
          EOF
