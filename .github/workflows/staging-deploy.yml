name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      certify_physical_devices:
        description: Run exact-SHA physical-device certification after deployment
        required: true
        default: false
        type: boolean
      installed_evidence_json:
        description: Sanitized iOS/Android installed-PWA evidence JSON
        required: false
        type: string
  push:
    branches:
      - testnet

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-testnet-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging-testnet
    runs-on: ubuntu-latest
    environment: staging-testnet

    env:
      STATIC_WEB_APP_NAME: nodezero-social-staging-testnet-web
      JSS_PROVISIONER_APP_NAME: nodezero-social-staging-testnet-provisioner
      SOLID_CONTAINER_APP_NAME: nz-staging-testnet-solid
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: rg-nodezero-social-staging-testnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment isolation policy
        run: pnpm policy:validate-env

      - name: Validate attestation fail-closed policy
        run: pnpm policy:validate-attestation-fail-closed

      - name: Validate DocuStream remains enabled
        run: pnpm policy:validate-docustream-enabled

      - name: Setup Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure with strict staging guardrails
        env:
          AZURE_BICEP_PARAMETERS_FILE: infrastructure/azure/main.parameters.staging-testnet.json
          AZURE_ENVIRONMENT_NAME: staging-testnet
        run: pnpm deploy:azure

      - name: Remove retired wallet broker domain
        run: |
          set -euo pipefail
          wallet_host="wallet.nodezero.social"
          if az staticwebapp hostname list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?domainName=='${wallet_host}'] | length(@)" -o tsv | grep -qx '1'; then
            set +e
            az staticwebapp hostname delete \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --hostname "$wallet_host" \
              --yes
            delete_status=$?
            set -e
            remaining_hostnames="$(az staticwebapp hostname list \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?domainName=='${wallet_host}'] | length(@)" -o tsv)"
            if [ "$remaining_hostnames" != '0' ]; then
              echo "Retired wallet hostname remains after delete attempt (exit ${delete_status})."
              exit 1
            fi
          fi
          if az network dns record-set cname show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --zone-name nodezero.social \
            --name wallet \
            --output none 2>/dev/null; then
            az network dns record-set cname delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --zone-name nodezero.social \
              --name wallet \
              --yes
          fi

      - name: Bind first-party provisioner API domain
        run: |
          set -euo pipefail
          api_host="api.nodezero.social"

          for attempt in {1..20}; do
            if az webapp config hostname list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --webapp-name "$JSS_PROVISIONER_APP_NAME" \
              --query "[?name=='${api_host}'].name | [0]" -o tsv | grep -qx "$api_host"; then
              break
            fi
            if az webapp config hostname add \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --webapp-name "$JSS_PROVISIONER_APP_NAME" \
              --hostname "$api_host"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Unable to bind ${api_host} after DNS propagation retries."
              exit 1
            fi
            sleep 15
          done

          thumbprint="$(az webapp config ssl list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(hostNames, '${api_host}')].thumbprint | [0]" -o tsv)"
          if [ -z "$thumbprint" ]; then
            az webapp config ssl create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$JSS_PROVISIONER_APP_NAME" \
              --hostname "$api_host" \
              --certificate-name "$api_host" \
              --output none || true
          fi
          if [ -z "$thumbprint" ]; then
            for attempt in {1..40}; do
              thumbprint="$(az webapp config ssl show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --certificate-name "$api_host" \
                --query thumbprint -o tsv 2>/dev/null || true)"
              if [ -n "$thumbprint" ]; then
                break
              fi
              if [ "$attempt" -eq 40 ]; then
                echo "Managed certificate for ${api_host} was not ready after 10 minutes."
                exit 1
              fi
              sleep 15
            done
          fi
          if [ -z "$thumbprint" ]; then
            echo "Unable to resolve managed certificate for ${api_host}."
            exit 1
          fi
          az webapp config ssl bind \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --certificate-thumbprint "$thumbprint" \
            --ssl-type SNI

      - name: Verify first-party API TLS
        run: |
          set -euo pipefail
          url="https://api.nodezero.social/health"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 20 "$url" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "First-party API did not become reachable: $url"
              exit 1
            fi
            sleep 15
          done

      # Non-blocking: this workflow does not deploy the solid-server stack
      # directly, so runtime image drift can exist independently of this run.
      - name: Verify Solid CSS image matches staging parameters (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail

          expected_image="$(jq -r '.parameters.cssImage.value // empty' infrastructure/azure/solid-server.parameters.staging-testnet.json)"
          if [ -z "$expected_image" ]; then
            echo "Expected cssImage is missing from solid-server.parameters.staging-testnet.json"
            exit 1
          fi

          if ! echo "$expected_image" | grep -Eq '^.+@sha256:[a-f0-9]{64}$'; then
            echo "Expected cssImage must be pinned by digest (repo@sha256:...)."
            echo "Got: $expected_image"
            exit 1
          fi

          active_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$SOLID_CONTAINER_APP_NAME" \
            --query 'properties.template.containers[0].image' \
            -o tsv)"

          if [ -z "$active_image" ]; then
            echo "Unable to resolve active image for $SOLID_CONTAINER_APP_NAME"
            exit 1
          fi

          echo "Expected CSS image: $expected_image"
          echo "Active CSS image:   $active_image"

          if [ "$active_image" != "$expected_image" ]; then
            echo "Solid CSS image drift detected between parameters and runtime template."
            exit 1
          fi

      - name: Build JSS provisioner
        run: pnpm --filter @nodezero/jss-provisioner build

      - name: Package JSS provisioner artifact
        id: package-provisioner
        working-directory: packages/jss-provisioner
        run: |
          set -euo pipefail
          # App Service removes root node_modules during startup. Keep runtime
          # dependencies next to dist/index.js so Node can resolve snarkjs for
          # the V3 bridge proof verifier after deployment.
          node -e "const fs=require('fs');const p=require('./package.json');delete p.dependencies['@nodezero/zk-crypto'];fs.writeFileSync('dist/package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --prefix dist --omit=dev --ignore-scripts --no-package-lock
          # The provisioner shares canonical claim serialization with the app,
          # but the standalone ZIP cannot install a workspace:* dependency.
          # Compile and vendor only that dependency-free module into the ZIP.
          mkdir -p dist/node_modules/@nodezero/zk-crypto
          pnpm exec tsc ../zk-crypto/src/pod-ownership-claim.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --outDir dist/node_modules/@nodezero/zk-crypto \
            --declaration false \
            --sourceMap false
          cat > dist/node_modules/@nodezero/zk-crypto/package.json <<'EOF'
          {
            "name": "@nodezero/zk-crypto",
            "version": "0.0.1",
            "type": "commonjs",
            "exports": {
              "./pod-claim": "./pod-ownership-claim.js"
            }
          }
          EOF
          node -e "console.log(require.resolve('snarkjs', { paths: ['dist'] }))"
          node -e "console.log(require.resolve('@nodezero/zk-crypto/pod-claim', { paths: ['dist'] }))"
          payload_sha256="$(find dist -type f ! -name build-info.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf '{"commit":"%s","payloadSha256":"%s"}\n' "$GITHUB_SHA" "$payload_sha256" > dist/build-info.json
          echo "payload_sha256=${payload_sha256}" >> "$GITHUB_OUTPUT"
          rm -f deploy.zip
          zip -r deploy.zip dist startup.sh

      - name: Configure JSS provisioner runtime
        run: |
          provisioner_artifact_sha256="$(sha256sum packages/jss-provisioner/deploy.zip | awk '{print $1}')"
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --linux-fx-version "NODE|22-lts" \
            --always-on true \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --startup-file "bash startup.sh"

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --settings \
              NZ_ENV_PROFILE="staging-testnet" \
              JSS_STELLAR_NETWORK_PASSPHRASE="Test SDF Network ; September 2015" \
              JSS_BUILD_COMMIT="${GITHUB_SHA}" \
              JSS_BUILD_ARTIFACT_SHA256="${provisioner_artifact_sha256}" \
              JSS_ISSUER_URL="https://solid.nodezero.social" \
              JSS_PUBLIC_PROVISIONER_BASE_URL="https://api.nodezero.social" \
              JSS_APP_ORIGIN="https://staging.nodezero.social" \
              JSS_SOLID_CSS_BASE_URL="https://solid.nodezero.social" \
              JSS_SOLID_CSS_POD_LOCK_RETRY_ATTEMPTS="8" \
              JSS_SOLID_CSS_POD_LOCK_RETRY_BASE_DELAY_MS="1000" \
              JSS_ALLOWED_ORIGINS="https://staging.nodezero.social,https://nodezero.social,https://www.nodezero.social,https://solid.nodezero.social,http://localhost:19006,http://localhost:8081" \
              JSS_BROWSER_SESSION_ENABLED="true" \
              JSS_LOCKBOX_FACTORY_MODE="soroban" \
              JSS_LOCKBOX_FACTORY_VERSION="v3" \
              JSS_LOCKBOX_FACTORY_CONTRACT_ID="CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT" \
              JSS_LOCKBOX_FACTORY_OPERATOR_ADDRESS="GDMJ3GFM2RPB5FRX5DS2IRRSVF6RFYILXZ2WIUIJQJJOHXJTQXOQVBHR" \
              JSS_LOCKBOX_BRIDGE_V3_MANIFEST_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json" \
              JSS_LOCKBOX_BRIDGE_V3_MANIFEST_SHA256="cd8dd099419334c3fda73d837032aea62588a6d4f3dac5167367fc13affe2b70" \
              JSS_LOCKBOX_BRIDGE_V3_WASM_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x_bridge_v3/pod_stellar_bridge_v3_js/pod_stellar_bridge_v3.wasm" \
              JSS_LOCKBOX_BRIDGE_V3_WASM_SHA256="a878e467bf4e11f82a67aaf46e36786bc66b909baa21ae2c802ac1e66b4d3150" \
              JSS_LOCKBOX_BRIDGE_V3_ZKEY_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x_bridge_v3/pod_stellar_bridge_v3_final.zkey" \
              JSS_LOCKBOX_BRIDGE_V3_ZKEY_SHA256="9cbc69f2d398fcee1309a815fef968866851e432f0f1fbaf39fb5992dbbf8784" \
              JSS_LOCKBOX_BRIDGE_V3_VK_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x_bridge_v3/pod_stellar_bridge_v3_vk.json" \
              JSS_LOCKBOX_BRIDGE_V3_VK_SHA256="b6bbc440444299e6d449ca0f2f594341f50c7e71a79f0c98734655fdcae8a39b" \
              JSS_IDENTITY_CONTRACT_ID="CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K" \
              JSS_TREASURY_SOURCE_ACCOUNT="nodezero-testnet-treasury" \
              JSS_DEPLOYER_SOURCE_ACCOUNT="nodezero-testnet-lockbox-deployer" \
              JSS_TREASURY_FUND_MEMBERS="true"

          # Session/credential secrets: only overwrite when the GitHub secret is
          # configured, so values managed directly on the App Service (e.g. set
          # via az during cutover) are never clobbered with empty strings.
          extra_settings=()
          if [ -n "${{ secrets.JSS_SESSION_SIGNING_KEY }}" ]; then
            extra_settings+=(JSS_SESSION_SIGNING_KEY="${{ secrets.JSS_SESSION_SIGNING_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY }}" ]; then
            extra_settings+=(JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY="${{ secrets.JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_CREDENTIALS_ENC_KEY }}" ]; then
            extra_settings+=(JSS_CREDENTIALS_ENC_KEY="${{ secrets.JSS_CREDENTIALS_ENC_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_CREDENTIALS_TABLE_SAS_URL }}" ]; then
            extra_settings+=(JSS_CREDENTIALS_TABLE_SAS_URL="${{ secrets.JSS_CREDENTIALS_TABLE_SAS_URL }}")
          fi
          if [ "${#extra_settings[@]}" -gt 0 ]; then
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$JSS_PROVISIONER_APP_NAME" \
              --settings "${extra_settings[@]}"
          fi

          relationship_key_count="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --query "length([?name=='JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY' && value!=''].value)" \
            --output tsv)"
          if [ "$relationship_key_count" != "1" ]; then
            echo "JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY must be configured as a GitHub secret or retained App Service setting."
            exit 1
          fi

      - name: Deploy JSS provisioner to App Service
        id: deploy-provisioner
        continue-on-error: true
        run: |
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --src-path packages/jss-provisioner/deploy.zip \
            --type zip

      - name: Verify JSS provisioner health
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_PAYLOAD_SHA256: ${{ steps.package-provisioner.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy-provisioner.outcome }}" != "success" ]; then
            echo "ZipDeploy transport reported '${{ steps.deploy-provisioner.outcome }}'; exact live provenance must prove whether deployment completed."
          fi
          health_url="https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health"
          echo "Waiting for provisioner health: ${health_url}"
          consecutive_healthy=0

          for attempt in {1..30}; do
            status_code="$(curl -sS -o /tmp/provisioner-health.json -w "%{http_code}" --max-time 10 "$health_url" || true)"
            if [ "$status_code" = "200" ]; then
              deployed_commit="$(jq -r '.build.commit // empty' /tmp/provisioner-health.json)"
              payload_sha="$(jq -r '.build.payloadSha256 // empty' /tmp/provisioner-health.json)"
              configured_artifact_sha="$(jq -r '.build.configuredArtifactSha256 // empty' /tmp/provisioner-health.json)"
              expected_artifact_sha="$(sha256sum packages/jss-provisioner/deploy.zip | awk '{print $1}')"
              if [ "$deployed_commit" = "$EXPECTED_COMMIT" ] && \
                  [ "$payload_sha" = "$EXPECTED_PAYLOAD_SHA256" ] && \
                 [ "$configured_artifact_sha" = "$expected_artifact_sha" ]; then
                consecutive_healthy=$((consecutive_healthy + 1))
                echo "Provisioner health and provenance passed on attempt ${attempt} (${consecutive_healthy}/3 consecutive)."
                if [ "$consecutive_healthy" -eq 3 ]; then
                  echo "Holding exact provenance for 30 seconds before mutating staging checks."
                  sleep 30
                  stable_commit="$(curl --fail --silent --show-error --max-time 10 "$health_url" | jq -r '.build.commit // empty')"
                  if [ "$stable_commit" != "$EXPECTED_COMMIT" ]; then
                    echo "Provisioner provenance changed during stabilization (${stable_commit})."
                    exit 1
                  fi
                  cat /tmp/provisioner-health.json
                  exit 0
                fi
              else
                consecutive_healthy=0
                echo "Attempt ${attempt}/30: provenance mismatch (commit='${deployed_commit}', payload='${payload_sha}', artifact='${configured_artifact_sha}')."
              fi
            else
              consecutive_healthy=0
            fi

            echo "Attempt ${attempt}/30: health returned HTTP ${status_code}. Retrying in 10s..."
            sleep 10
          done

          echo "Provisioner failed health check after 30 attempts."
          exit 1

      - name: Warm JSS provisioner onboarding endpoint
        run: |
          set -euo pipefail
          warmup_url="https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/v1/solid-account/check-email"
          payload='{"email":"qa-warmup+staging@nodezero.social"}'

          for attempt in {1..20}; do
            status_code="$(curl -sS -o /tmp/provisioner-warmup.json -w "%{http_code}" \
              --max-time 15 \
              -H "content-type: application/json" \
              -H "accept: application/json" \
              -X POST \
              --data "$payload" \
              "$warmup_url" || true)"

            if [ "$status_code" = "200" ]; then
              echo "Provisioner warmup succeeded on attempt ${attempt}."
              cat /tmp/provisioner-warmup.json
              exit 0
            fi

            echo "Attempt ${attempt}/20: warmup returned HTTP ${status_code}. Retrying in 6s..."
            sleep 6
          done

          echo "Provisioner warmup failed after 20 attempts."
          exit 1

      - name: Build Expo web artifact
        env:
          # Full staging-testnet profile. NZ_ENV_PROFILE enables the strict
          # variable checks in app.config.js, so a build missing any of these
          # fails instead of silently shipping a local-profile bundle (which
          # would drop the Node Zero Community Server as the default IdP).
          NZ_ENV_PROFILE: staging-testnet
          NZ_RELAY_URL: wss://nodezero-social-staging-testnet-relay.azurewebsites.net
          NZ_IDENTITY_CONTRACT_ID: CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K
          NZ_LOCKBOX_CONTRACT_ID: CB36LY5WZLJNMY4DHRXQER6LU3L4E5MGFYT2XSJG7ZJZV5SIIOKODT2H
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_FACTORY_VERSION: '3'
          NZ_ZK_ARTIFACTS_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/
          NZ_ZK_MANIFEST_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json
          NZ_NODEZERO_ISSUER_URL: https://solid.nodezero.social/
          NZ_NODEZERO_DIRECTORY_URL: https://api.nodezero.social/v1/community-directory/index
          NZ_APP_ORIGIN: https://staging.nodezero.social
          NZ_SEAMLESS_ONBOARDING_ENABLED: 'true'
          NZ_JSS_PROVISIONER_URL: https://api.nodezero.social
          NZ_BROWSER_SESSION_ENABLED: 'true'
          NZ_SOLID_BOOTSTRAP_ENABLED: 'true'
          NZ_MASHLIB_EXPLORER_ENABLED: 'true'
          NZ_MASHLIB_MODULE_ID: nodezero:mashlib-pane-provider
        run: pnpm --filter @nodezero/mobile-app build:web

      - name: Validate PWA web artifact
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_APP_ORIGIN: https://staging.nodezero.social
        run: pnpm pwa:validate:artifact

      - name: Write staging deploy marker
        run: |
          cat > packages/mobile-app/dist/deploy-marker.json <<EOF
          {
            "environment": "staging-testnet",
            "workflow": "staging-deploy",
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "generatedAtUtc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Add Static Web Apps navigation fallback
        run: cp packages/mobile-app/staticwebapp.config.json packages/mobile-app/dist/staticwebapp.config.json

      - name: Resolve Static Web Apps deployment token
        id: swa-token
        run: |
          token="$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          if [ -z "$token" ]; then
            echo "Unable to resolve Static Web Apps deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish Expo web artifact to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: packages/mobile-app/dist
          api_location: ""
          output_location: ""
          skip_app_build: true

      - name: Resolve staging hostname
        id: hostname
        run: |
          STATIC_WEB_APP_HOSTNAME="$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostname -o tsv)"
          if [ -z "$STATIC_WEB_APP_HOSTNAME" ]; then
            echo "Unable to resolve the Static Web App hostname."
            exit 1
          fi
          echo "hostname=$STATIC_WEB_APP_HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Verify deployed marker provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker_url="https://${{ steps.hostname.outputs.hostname }}/deploy-marker.json"
          echo "Checking marker: ${marker_url}"

          for attempt in {1..18}; do
            marker_json="$(curl -sS --max-time 20 "$marker_url" || true)"
            echo "$marker_json" > /tmp/deploy-marker.json

            marker_env="$(jq -r '.environment // empty' /tmp/deploy-marker.json 2>/dev/null || true)"
            marker_workflow="$(jq -r '.workflow // empty' /tmp/deploy-marker.json 2>/dev/null || true)"
            marker_commit="$(jq -r '.commit // empty' /tmp/deploy-marker.json 2>/dev/null || true)"

            if [ "$marker_env" = "staging-testnet" ] && \
               [ "$marker_workflow" = "staging-deploy" ] && \
               [ "$marker_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Marker provenance check passed on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt}/18: marker not updated yet (env='${marker_env}', workflow='${marker_workflow}', commit='${marker_commit}'). Retrying in 10s..."
            sleep 10
          done

          echo "Marker provenance check failed after retries. Expected commit '$EXPECTED_COMMIT'."
          exit 1

      - name: Run staging smoke suite
        env:
          STAGING_BASE_URL: https://${{ steps.hostname.outputs.hostname }}
        run: pnpm qa:smoke

      - name: Install Playwright browsers for auth gate
        run: pnpm exec playwright install chromium --with-deps

      - name: Verify public apex marker convergence for auth gate
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          marker_url="https://nodezero.social/deploy-marker.json"
          echo "Checking public apex marker: ${marker_url}"

          for attempt in {1..24}; do
            marker_json="$(curl -sS --max-time 20 "$marker_url" || true)"
            echo "$marker_json" > /tmp/staging-domain-marker.json

            marker_env="$(jq -r '.environment // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"
            marker_workflow="$(jq -r '.workflow // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"
            marker_commit="$(jq -r '.commit // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"

            if [ "$marker_env" = "staging-testnet" ] && \
               [ "$marker_workflow" = "staging-deploy" ] && \
               [ "$marker_commit" = "$EXPECTED_COMMIT" ]; then
              echo "Public apex marker converged on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt}/24: public apex marker not converged (env='${marker_env}', workflow='${marker_workflow}', commit='${marker_commit}'). Retrying in 10s..."
            sleep 10
          done

          echo "Public apex marker did not converge to commit '$EXPECTED_COMMIT' before auth gate."
          exit 1

      # BLOCKING auth release gate: new-user onboarding (Pod + WebID + Stellar
      # lockb0x anchor + ZK attestation + inline NodeZero session), returning
      # one-tap Stellar sign-in, and fail-closed session enforcement —
      # end-to-end on staging. The browser must never contact the CSS origin.
      # No retry: session issuance is a single server round-trip with no
      # redirect-timing window.
      - name: Run onboarding/authentication E2E gate
        id: auth-e2e
        env:
          STAGING_BASE_URL: https://staging.nodezero.social
          NZ_INTERNAL_APP_URL: https://staging.nodezero.social
          NZ_EXPECT_INTERNAL_STAGING_HANDOFF: 'false'
          AUTH_E2E_SESSION_TIMEOUT_MS: '360000'
        run: pnpm qa:smoke:auth

      - name: Audit release-created V3 lockb0x state
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_AUDIT_LEDGER_WINDOW: '300'
          NZ_LOCKBOX_AUDIT_REQUIRE_EVENTS: 'true'
          NZ_LOCKBOX_AUDIT_EXPECTED_CHILD_IDS: ${{ steps.auth-e2e.outputs.lockbox_contract_id }}
        run: pnpm qa:audit:lockbox

      # Application-feature proofs (DocuStream/mashlib). NOT part of the auth
      # release gate — failures surface for triage without blocking identity.
      - name: Run DocuStream pane proof (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ "${{ steps.auth-e2e.outputs.docustream_pane_passed }}" != "true" ]; then
            echo "Authenticated DocuStream pane probe did not pass."
            exit 1
          fi
          echo "Authenticated DocuStream pane probe passed in the identity browser context."

      - name: Run focused mashlib runtime proof (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_RELAY_URL: wss://nodezero-social-staging-testnet-relay.azurewebsites.net
          NZ_IDENTITY_CONTRACT_ID: CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K
          NZ_LOCKBOX_CONTRACT_ID: CB36LY5WZLJNMY4DHRXQER6LU3L4E5MGFYT2XSJG7ZJZV5SIIOKODT2H
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_FACTORY_VERSION: '3'
          NZ_ZK_ARTIFACTS_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/
          NZ_ZK_MANIFEST_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json
          NZ_NODEZERO_ISSUER_URL: https://solid.nodezero.social/
          NZ_JSS_PROVISIONER_URL: https://api.nodezero.social
          NZ_BROWSER_SESSION_ENABLED: 'true'
          NZ_SOLID_BOOTSTRAP_ENABLED: 'true'
          NZ_MASHLIB_EXPLORER_ENABLED: 'true'
          NZ_MASHLIB_MODULE_ID: nodezero:mashlib-pane-provider
        run: pnpm qa:smoke:mashlib-runtime

      - name: Run deployed mashlib bundle proof (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: https://${{ steps.hostname.outputs.hostname }}
        run: pnpm qa:smoke:mashlib-deployed

      - name: Staging deployment summary
        run: echo "Staging infrastructure deployment, Expo web publish, smoke suite, and auth E2E gate completed."

  certify-physical-devices:
    name: Exact-SHA physical-device certification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_physical_devices == true }}
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact live candidate
        run: |
          set -euo pipefail
          curl --fail --silent --show-error https://staging.nodezero.social/deploy-marker.json > /tmp/deploy-marker.json
          live_sha="$(jq -r '.commit // empty' /tmp/deploy-marker.json)"
          if [ "$live_sha" != "$GITHUB_SHA" ]; then
            echo "Live marker ${live_sha} does not match candidate ${GITHUB_SHA}."
            exit 1
          fi

      - name: Require physical-device runner and installed evidence
        env:
          DEVICE_ENDPOINT: ${{ secrets.NZ_DEVICE_CLOUD_ENDPOINT }}
          DEVICE_TOKEN: ${{ secrets.NZ_DEVICE_CLOUD_TOKEN }}
          INSTALLED_EVIDENCE_JSON: ${{ inputs.installed_evidence_json }}
        run: |
          if [ -z "$DEVICE_ENDPOINT" ] || [ -z "$DEVICE_TOKEN" ]; then
            echo "Physical-device runner credentials are not configured."
            exit 1
          fi
          if [ -z "$INSTALLED_EVIDENCE_JSON" ]; then
            echo "Certification requires sanitized iOS and Android installed-PWA evidence."
            exit 1
          fi

      - name: Run physical browser-tab lanes
        env:
          NZ_DEVICE_CLOUD_ENDPOINT: ${{ secrets.NZ_DEVICE_CLOUD_ENDPOINT }}
          NZ_DEVICE_CLOUD_TOKEN: ${{ secrets.NZ_DEVICE_CLOUD_TOKEN }}
          NZ_DEVICE_EXPECTED_SHA: ${{ github.sha }}
          NZ_DEVICE_EXPECTED_URL: https://staging.nodezero.social
          NZ_DEVICE_CLOUD_OUTPUT: device-evidence/browser-tab.json
        run: |
          mkdir -p device-evidence
          node scripts/qa/run-device-cloud.mjs

      - name: Validate browser-tab evidence
        env:
          NZ_DEVICE_EXPECTED_SHA: ${{ github.sha }}
          NZ_DEVICE_EXPECTED_URL: https://staging.nodezero.social
          NZ_DEVICE_REQUIRED_MODES: browser-tab
        run: node scripts/qa/validate-device-evidence.mjs device-evidence/browser-tab.json

      - name: Validate installed-PWA evidence
        env:
          INSTALLED_EVIDENCE_JSON: ${{ inputs.installed_evidence_json }}
          NZ_DEVICE_EXPECTED_SHA: ${{ github.sha }}
          NZ_DEVICE_EXPECTED_URL: https://staging.nodezero.social
          NZ_DEVICE_REQUIRED_MODES: installed-pwa
        run: |
          printf '%s\n' "$INSTALLED_EVIDENCE_JSON" > device-evidence/installed-pwa.json
          node scripts/qa/validate-device-evidence.mjs device-evidence/installed-pwa.json

      - name: Upload sanitized physical-device summaries
        uses: actions/upload-artifact@v4
        with:
          name: pwa-device-evidence-${{ github.sha }}
          path: device-evidence/*.json
          retention-days: 7
          if-no-files-found: error
