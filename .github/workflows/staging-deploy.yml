name: Staging Deploy

on:
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy staging-testnet
    runs-on: ubuntu-latest
    environment: staging-testnet

    env:
      STATIC_WEB_APP_NAME: nodezero-social-staging-testnet-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment isolation policy
        run: pnpm policy:validate-env

      - name: Validate Static Web Apps token is configured
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "AZURE_STATIC_WEB_APPS_API_TOKEN is required for staging publish."
            exit 1
          fi

      - name: Setup Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure with strict staging guardrails
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_BICEP_PARAMETERS_FILE: infrastructure/azure/main.parameters.staging-testnet.json
          AZURE_ENVIRONMENT_NAME: staging-testnet
        run: pnpm deploy:azure

      - name: Build Expo web artifact
        run: pnpm --filter @nodezero/mobile-app build:web

      - name: Publish Expo web artifact to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: packages/mobile-app/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

      - name: Resolve staging hostname
        id: hostname
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          STATIC_WEB_APP_HOSTNAME="$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostname -o tsv)"
          if [ -z "$STATIC_WEB_APP_HOSTNAME" ]; then
            echo "Unable to resolve the Static Web App hostname."
            exit 1
          fi
          echo "hostname=$STATIC_WEB_APP_HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Run staging smoke suite
        env:
          STAGING_BASE_URL: https://${{ steps.hostname.outputs.hostname }}
        run: pnpm qa:smoke

      - name: Staging deployment summary
        run: echo "Staging infrastructure deployment, Expo web publish, and smoke suite completed."
