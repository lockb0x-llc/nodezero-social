name: Staging Deploy

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: Capture the live N-1 baseline or deploy an authenticated candidate
        required: true
        default: capture-baseline
        type: choice
        options:
          - capture-baseline
          - deploy
      expected_deployed_commit:
        description: Exact live staging commit required for baseline capture
        required: false
        type: string
      confirm_staging_testnet:
        description: Confirm this operation targets staging-testnet only
        required: true
        default: false
        type: boolean
      certify_physical_devices:
        description: Run exact-SHA physical-device certification after deployment
        required: true
        default: false
        type: boolean
      installed_evidence_json:
        description: Sanitized iOS/Android installed-PWA evidence JSON
        required: false
        type: string
      baseline_capture_run_id:
        description: Successful Capture Staging Baseline run containing the current N-1 artifact
        required: false
        type: string
      baseline_commit:
        description: Exact currently deployed commit captured as the N-1 baseline
        required: false
        type: string
      baseline_capture_run_attempt:
        description: Exact successful Capture Staging Baseline run attempt
        required: false
        type: string
      baseline_tooling_commit:
        description: Exact candidate SHA that executed the baseline capture workflow
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: staging-testnet-deploy
  cancel-in-progress: false

jobs:
  validate-dispatch:
    name: Validate staging release action
    runs-on: ubuntu-latest
    steps:
      - name: Validate fail-closed dispatch inputs
        env:
          RELEASE_ACTION: ${{ inputs.release_action }}
          CONFIRM_STAGING_TESTNET: ${{ inputs.confirm_staging_testnet }}
          EXPECTED_DEPLOYED_COMMIT: ${{ inputs.expected_deployed_commit }}
          BASELINE_RUN_ID: ${{ inputs.baseline_capture_run_id }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          BASELINE_RUN_ATTEMPT: ${{ inputs.baseline_capture_run_attempt }}
          BASELINE_TOOLING_COMMIT: ${{ inputs.baseline_tooling_commit }}
        run: |
          set -euo pipefail
          [ "$CONFIRM_STAGING_TESTNET" = "true" ]
          case "$RELEASE_ACTION" in
            capture-baseline)
              [[ "$EXPECTED_DEPLOYED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
              ;;
            deploy)
              [[ "$BASELINE_RUN_ID" =~ ^[0-9]+$ ]]
              [[ "$BASELINE_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
              [[ "$BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
              [[ "$BASELINE_TOOLING_COMMIT" =~ ^[0-9a-f]{40}$ ]]
              ;;
            *)
              echo "Unsupported release action: $RELEASE_ACTION"
              exit 1
              ;;
          esac

  capture-baseline:
    name: Capture authenticated live N-1
    needs: validate-dispatch
    if: ${{ inputs.release_action == 'capture-baseline' }}
    uses: ./.github/workflows/staging-baseline-capture.yml
    with:
      expected_deployed_commit: ${{ inputs.expected_deployed_commit }}
      confirm_staging_testnet: ${{ inputs.confirm_staging_testnet }}
    secrets: inherit

  deploy-staging:
    name: Deploy staging-testnet
    needs: validate-dispatch
    if: ${{ inputs.release_action == 'deploy' }}
    runs-on: ubuntu-latest
    environment: staging-testnet

    env:
      STATIC_WEB_APP_NAME: nodezero-social-staging-testnet-web
      JSS_PROVISIONER_APP_NAME: nodezero-social-staging-testnet-provisioner
      RELAY_APP_NAME: nodezero-social-staging-testnet-relay
      SOLID_CONTAINER_APP_NAME: nz-staging-testnet-solid
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: rg-nodezero-social-staging-testnet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Authenticate retained N-1 baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASELINE_RUN_ID: ${{ inputs.baseline_capture_run_id }}
          BASELINE_COMMIT: ${{ inputs.baseline_commit }}
          BASELINE_RUN_ATTEMPT: ${{ inputs.baseline_capture_run_attempt }}
          BASELINE_TOOLING_COMMIT: ${{ inputs.baseline_tooling_commit }}
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN_ID}")"
          workflow_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/$(jq -r '.workflow_id' <<<"$run_json")")"
          workflow_path="$(jq -r '.path' <<<"$workflow_json")"
          workflow_name="$(jq -r '.name' <<<"$workflow_json")"
          if [ "$workflow_path" = ".github/workflows/staging-baseline-capture.yml" ]; then
            [ "$workflow_name" = "Capture Staging Baseline" ]
          else
            [ "$workflow_path" = ".github/workflows/staging-deploy.yml" ]
            [ "$workflow_name" = "Staging Deploy" ]
            [ "$(jq -r '.event' <<<"$run_json")" = "workflow_dispatch" ]
          fi
          [ "$(jq -r '.conclusion' <<<"$run_json")" = "success" ]
          [ "$(jq -r '.head_branch' <<<"$run_json")" = "testnet" ]
          [ "$(jq -r '.head_sha' <<<"$run_json")" = "$BASELINE_TOOLING_COMMIT" ]
          [ "$(jq -r '.run_attempt' <<<"$run_json")" = "$BASELINE_RUN_ATTEMPT" ]
          [ "$BASELINE_TOOLING_COMMIT" = "$GITHUB_SHA" ]
          marker="$(node ./scripts/qa/fetch-exact.mjs https://staging.nodezero.social/deploy-marker.json)"
          [ "$(jq -r '.commit // empty' <<<"$marker")" = "$BASELINE_COMMIT" ]
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_RUN_ID}/artifacts" \
            --jq ".artifacts[] | select(.name == \"staging-baseline-${BASELINE_COMMIT}\" and .expired == false) | .id" \
            | head -n1)"
          [[ "$artifact_id" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/baseline-artifact.zip
          rm -rf /tmp/baseline-artifact
          mkdir -p /tmp/baseline-artifact
          unzip -q /tmp/baseline-artifact.zip -d /tmp/baseline-artifact
          manifest=/tmp/baseline-artifact/manifest.json
          [ "$(jq -r '.kind' "$manifest")" = "staging-n-1-baseline" ]
          [ "$(jq -r '.commit' "$manifest")" = "$BASELINE_COMMIT" ]
          [ "$(jq -r '.captureToolingCommit' "$manifest")" = "$BASELINE_TOOLING_COMMIT" ]
          [ "$(jq -r '.capturedByRunId' "$manifest")" = "$BASELINE_RUN_ID" ]
          [ "$(jq -r '.capturedByRunAttempt' "$manifest")" = "$BASELINE_RUN_ATTEMPT" ]
          [ "$(jq -r '.components.provisioner.commit' "$manifest")" = "$BASELINE_COMMIT" ]
          [ "$(sha256sum /tmp/baseline-artifact/provisioner.zip | awk '{print $1}')" = "$(jq -r '.sha256.provisionerZip' "$manifest")" ]
          [ "$(sha256sum /tmp/baseline-artifact/relay.zip | awk '{print $1}')" = "$(jq -r '.sha256.relayZip' "$manifest")" ]
          [ "$(sha256sum /tmp/baseline-artifact/pwa-files.sha256 | awk '{print $1}')" = "$(jq -r '.sha256.pwaTree' "$manifest")" ]
          [ "$(sha256sum /tmp/baseline-artifact/provisioner-files.sha256 | awk '{print $1}')" = "$(jq -r '.sha256.provisionerTree' "$manifest")" ]
          [ "$(sha256sum /tmp/baseline-artifact/relay-files.sha256 | awk '{print $1}')" = "$(jq -r '.sha256.relayTree' "$manifest")" ]
          rm -rf /tmp/baseline-provisioner /tmp/baseline-relay
          mkdir -p /tmp/baseline-provisioner /tmp/baseline-relay/deploy
          unzip -q /tmp/baseline-artifact/provisioner.zip -d /tmp/baseline-provisioner
          unzip -q /tmp/baseline-artifact/relay.zip -d /tmp/baseline-relay/deploy
          (cd /tmp/baseline-provisioner && sha256sum --check /tmp/baseline-artifact/provisioner-files.sha256)
          (cd /tmp/baseline-relay/deploy && sha256sum --check /tmp/baseline-artifact/relay-files.sha256)
          [ "$(jq -r '.components.provisioner.provenance // empty' "$manifest")" = "authenticated-live-tree" ]
          provisioner_payload="$(jq -r '.components.provisioner.payloadSha256 // empty' "$manifest")"
          provisioner_configured_artifact="$(jq -r '.components.provisioner.configuredArtifactSha256 // empty' "$manifest")"
          [[ "$provisioner_payload" =~ ^[0-9a-f]{64}$ ]]
          [[ "$provisioner_configured_artifact" =~ ^[0-9a-f]{64}$ ]]
          [ "$(jq -r '.commit' /tmp/baseline-provisioner/dist/build-info.json)" = "$BASELINE_COMMIT" ]
          [ "$(jq -r '.payloadSha256' /tmp/baseline-provisioner/dist/build-info.json)" = "$provisioner_payload" ]
          relay_provenance="$(jq -r '.components.relay.provenance // empty' "$manifest")"
          relay_deployment_id="$(jq -r '.components.relay.kuduDeploymentId // empty' "$manifest")"
          test -n "$relay_deployment_id"
          if [ "$relay_provenance" = "embedded-build-info" ]; then
            relay_payload="$(cd /tmp/baseline-relay && find deploy -type f ! -name build-info.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
            [ "$(jq -r '.commit' /tmp/baseline-relay/deploy/build-info.json)" = "$BASELINE_COMMIT" ]
            [ "$(jq -r '.payloadSha256' /tmp/baseline-relay/deploy/build-info.json)" = "$relay_payload" ]
            [ "$(jq -r '.components.relay.commit' "$manifest")" = "$BASELINE_COMMIT" ]
            [ "$(jq -r '.components.relay.payloadSha256' "$manifest")" = "$relay_payload" ]
          elif [ "$relay_provenance" = "kudu-deployment-tree" ]; then
            test ! -f /tmp/baseline-relay/deploy/build-info.json
            [ -z "$(jq -r '.components.relay.commit // empty' "$manifest")" ]
            [ -z "$(jq -r '.components.relay.payloadSha256 // empty' "$manifest")" ]
          else
            echo "Unsupported baseline relay provenance: $relay_provenance"
            exit 1
          fi
          while read -r _ relative_path; do
            test -f "/tmp/baseline-artifact/pwa-dist/${relative_path#./}" || {
              echo "Baseline artifact is missing checksummed PWA file: ${relative_path}"
              exit 1
            }
          done < /tmp/baseline-artifact/pwa-files.sha256
          (cd /tmp/baseline-artifact/pwa-dist && sha256sum --check ../pwa-files.sha256)

      - name: Validate environment isolation policy
        run: pnpm policy:validate-env

      - name: Validate consentful discovery security policy
        run: pnpm policy:validate-consentful-discovery

      - name: Validate consentful discovery implementation boundaries
        run: pnpm qa:smoke:consentful-discovery

      - name: Validate attestation fail-closed policy
        run: pnpm policy:validate-attestation-fail-closed

      - name: Validate DocuStream remains enabled
        run: pnpm policy:validate-docustream-enabled

      - name: Setup Azure CLI
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az version

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure infrastructure with strict staging guardrails
        env:
          AZURE_BICEP_PARAMETERS_FILE: infrastructure/azure/main.parameters.staging-testnet.json
          AZURE_ENVIRONMENT_NAME: staging-testnet
        run: pnpm deploy:azure

      - name: Remove retired wallet broker domain
        run: |
          set -euo pipefail
          wallet_host="wallet.nodezero.social"
          if az staticwebapp hostname list \
            --name "$STATIC_WEB_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?domainName=='${wallet_host}'] | length(@)" -o tsv | grep -qx '1'; then
            set +e
            az staticwebapp hostname delete \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --hostname "$wallet_host" \
              --yes
            delete_status=$?
            set -e
            remaining_hostnames="$(az staticwebapp hostname list \
              --name "$STATIC_WEB_APP_NAME" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?domainName=='${wallet_host}'] | length(@)" -o tsv)"
            if [ "$remaining_hostnames" != '0' ]; then
              echo "Retired wallet hostname remains after delete attempt (exit ${delete_status})."
              exit 1
            fi
          fi
          if az network dns record-set cname show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --zone-name nodezero.social \
            --name wallet \
            --output none 2>/dev/null; then
            az network dns record-set cname delete \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --zone-name nodezero.social \
              --name wallet \
              --yes
          fi

      - name: Bind first-party provisioner API domain
        run: |
          set -euo pipefail
          api_host="api.nodezero.social"

          for attempt in {1..20}; do
            if az webapp config hostname list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --webapp-name "$JSS_PROVISIONER_APP_NAME" \
              --query "[?name=='${api_host}'].name | [0]" -o tsv | grep -qx "$api_host"; then
              break
            fi
            if az webapp config hostname add \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --webapp-name "$JSS_PROVISIONER_APP_NAME" \
              --hostname "$api_host"; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Unable to bind ${api_host} after DNS propagation retries."
              exit 1
            fi
            sleep 15
          done

          thumbprint="$(az webapp config ssl list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "[?contains(hostNames, '${api_host}')].thumbprint | [0]" -o tsv)"
          if [ -z "$thumbprint" ]; then
            az webapp config ssl create \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$JSS_PROVISIONER_APP_NAME" \
              --hostname "$api_host" \
              --certificate-name "$api_host" \
              --output none || true
          fi
          if [ -z "$thumbprint" ]; then
            for attempt in {1..40}; do
              thumbprint="$(az webapp config ssl show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --certificate-name "$api_host" \
                --query thumbprint -o tsv 2>/dev/null || true)"
              if [ -n "$thumbprint" ]; then
                break
              fi
              if [ "$attempt" -eq 40 ]; then
                echo "Managed certificate for ${api_host} was not ready after 10 minutes."
                exit 1
              fi
              sleep 15
            done
          fi
          if [ -z "$thumbprint" ]; then
            echo "Unable to resolve managed certificate for ${api_host}."
            exit 1
          fi
          az webapp config ssl bind \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --certificate-thumbprint "$thumbprint" \
            --ssl-type SNI

      - name: Verify first-party API TLS
        run: |
          set -euo pipefail
          url="https://api.nodezero.social/health"
          for attempt in {1..20}; do
            if node ./scripts/qa/fetch-exact.mjs "$url" /tmp/api-health.json; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "First-party API did not become reachable: $url"
              exit 1
            fi
            sleep 15
          done

      # Non-blocking: this workflow does not deploy the solid-server stack
      # directly, so runtime image drift can exist independently of this run.
      - name: Verify Solid CSS image matches staging parameters (non-blocking)
        continue-on-error: true
        run: |
          set -euo pipefail

          expected_image="$(jq -r '.parameters.cssImage.value // empty' infrastructure/azure/solid-server.parameters.staging-testnet.json)"
          if [ -z "$expected_image" ]; then
            echo "Expected cssImage is missing from solid-server.parameters.staging-testnet.json"
            exit 1
          fi

          if ! echo "$expected_image" | grep -Eq '^.+@sha256:[a-f0-9]{64}$'; then
            echo "Expected cssImage must be pinned by digest (repo@sha256:...)."
            echo "Got: $expected_image"
            exit 1
          fi

          active_image="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$SOLID_CONTAINER_APP_NAME" \
            --query 'properties.template.containers[0].image' \
            -o tsv)"

          if [ -z "$active_image" ]; then
            echo "Unable to resolve active image for $SOLID_CONTAINER_APP_NAME"
            exit 1
          fi

          echo "Expected CSS image: $expected_image"
          echo "Active CSS image:   $active_image"

          if [ "$active_image" != "$expected_image" ]; then
            echo "Solid CSS image drift detected between parameters and runtime template."
            exit 1
          fi

      - name: Build JSS provisioner
        run: |
          rm -rf packages/jss-provisioner/dist packages/solid-pod-sync/dist
          pnpm --filter @nodezero/jss-provisioner build

      - name: Package JSS provisioner artifact
        id: package-provisioner
        working-directory: packages/jss-provisioner
        run: |
          set -euo pipefail
          rm -rf flat-runtime deploy.zip
          mkdir -p flat-runtime/dist
          cp -r dist/. flat-runtime/dist/
          cp startup.sh install-stellar-cli.sh flat-runtime/
          cp runtime/package.json runtime/package-lock.json flat-runtime/dist/
          npm ci --prefix flat-runtime/dist --omit=dev --ignore-scripts --bin-links=false
          mkdir -p flat-runtime/dist/node_modules/@nodezero/solid-pod-sync
          cp -r ../solid-pod-sync/dist/. flat-runtime/dist/node_modules/@nodezero/solid-pod-sync/
          cat > flat-runtime/dist/node_modules/@nodezero/solid-pod-sync/package.json <<'EOF'
          {
            "name": "@nodezero/solid-pod-sync",
            "version": "0.0.1",
            "type": "commonjs",
            "main": "./index.js",
            "exports": {
              ".": "./index.js"
            }
          }
          EOF
          node -e "const root=process.argv[1];console.log(require.resolve('snarkjs',{paths:[root]}));const solid=require.resolve('@nodezero/solid-pod-sync',{paths:[root]});console.log(solid);require(solid)" "$(pwd)/flat-runtime/dist"
          test -z "$(find flat-runtime -type l -print -quit)"
          payload_sha256="$(cd flat-runtime && find . -type f ! -path './dist/build-info.json' -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf '{"commit":"%s","payloadSha256":"%s"}\n' "$GITHUB_SHA" "$payload_sha256" > flat-runtime/dist/build-info.json
          echo "payload_sha256=${payload_sha256}" >> "$GITHUB_OUTPUT"
          (cd flat-runtime && zip -r ../deploy.zip .)

      - name: Configure JSS provisioner runtime
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --linux-fx-version "NODE|22-lts" \
            --always-on true \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --startup-file "bash startup.sh"

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --settings \
              NZ_ENV_PROFILE="staging-testnet" \
              JSS_STELLAR_NETWORK_PASSPHRASE="Test SDF Network ; September 2015" \
              JSS_ISSUER_URL="https://solid.nodezero.social" \
              JSS_PUBLIC_PROVISIONER_BASE_URL="https://api.nodezero.social" \
              JSS_APP_ORIGIN="https://staging.nodezero.social" \
              JSS_SOLID_CSS_BASE_URL="https://solid.nodezero.social" \
              JSS_SOLID_CSS_POD_LOCK_RETRY_ATTEMPTS="8" \
              JSS_SOLID_CSS_POD_LOCK_RETRY_BASE_DELAY_MS="1000" \
              JSS_ALLOWED_ORIGINS="https://staging.nodezero.social,https://nodezero.social,https://www.nodezero.social,https://solid.nodezero.social,http://localhost:19006,http://localhost:8081" \
              JSS_BROWSER_SESSION_ENABLED="true" \
              JSS_Q_DIRECTORY_ENABLED="false" \
              JSS_Q_PEER_PROFILE_ENABLED="false" \
              JSS_Q_RELATIONSHIP_ENABLED="false" \
              JSS_Q_TRANSPORT_ENABLED="false" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false" \
              ENABLE_ORYX_BUILD="false" \
              JSS_LOCKBOX_FACTORY_MODE="soroban" \
              JSS_LOCKBOX_FACTORY_VERSION="v3" \
              JSS_LOCKBOX_FACTORY_CONTRACT_ID="CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT" \
              JSS_LOCKBOX_FACTORY_OPERATOR_ADDRESS="GDMJ3GFM2RPB5FRX5DS2IRRSVF6RFYILXZ2WIUIJQJJOHXJTQXOQVBHR" \
              JSS_LOCKBOX_BRIDGE_V3_MANIFEST_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json" \
              JSS_LOCKBOX_BRIDGE_V3_MANIFEST_SHA256="cd8dd099419334c3fda73d837032aea62588a6d4f3dac5167367fc13affe2b70" \
              JSS_LOCKBOX_BRIDGE_V3_WASM_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x_bridge_v3/pod_stellar_bridge_v3_js/pod_stellar_bridge_v3.wasm" \
              JSS_LOCKBOX_BRIDGE_V3_WASM_SHA256="a878e467bf4e11f82a67aaf46e36786bc66b909baa21ae2c802ac1e66b4d3150" \
              JSS_LOCKBOX_BRIDGE_V3_ZKEY_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x_bridge_v3/pod_stellar_bridge_v3_final.zkey" \
              JSS_LOCKBOX_BRIDGE_V3_ZKEY_SHA256="9cbc69f2d398fcee1309a815fef968866851e432f0f1fbaf39fb5992dbbf8784" \
              JSS_LOCKBOX_BRIDGE_V3_VK_URL="https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x_bridge_v3/pod_stellar_bridge_v3_vk.json" \
              JSS_LOCKBOX_BRIDGE_V3_VK_SHA256="b6bbc440444299e6d449ca0f2f594341f50c7e71a79f0c98734655fdcae8a39b" \
              JSS_IDENTITY_CONTRACT_ID="CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K" \
              JSS_TREASURY_SOURCE_ACCOUNT="nodezero-testnet-treasury" \
              JSS_DEPLOYER_SOURCE_ACCOUNT="nodezero-testnet-lockbox-deployer" \
              JSS_TREASURY_FUND_MEMBERS="true"

          # Session/credential secrets: only overwrite when the GitHub secret is
          # configured, so values managed directly on the App Service (e.g. set
          # via az during cutover) are never clobbered with empty strings.
          extra_settings=()
          if [ -n "${{ secrets.JSS_SESSION_SIGNING_KEY }}" ]; then
            extra_settings+=(JSS_SESSION_SIGNING_KEY="${{ secrets.JSS_SESSION_SIGNING_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY }}" ]; then
            extra_settings+=(JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY="${{ secrets.JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_TRANSPORT_IDENTITY_SIGNING_KEY }}" ]; then
            extra_settings+=(JSS_TRANSPORT_IDENTITY_SIGNING_KEY="${{ secrets.JSS_TRANSPORT_IDENTITY_SIGNING_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_CREDENTIALS_ENC_KEY }}" ]; then
            extra_settings+=(JSS_CREDENTIALS_ENC_KEY="${{ secrets.JSS_CREDENTIALS_ENC_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_CREDENTIALS_TABLE_SAS_URL }}" ]; then
            extra_settings+=(JSS_CREDENTIALS_TABLE_SAS_URL="${{ secrets.JSS_CREDENTIALS_TABLE_SAS_URL }}")
            extra_settings+=(JSS_COMMUNITY_DIRECTORY_TABLE_SAS_URL="${{ secrets.JSS_CREDENTIALS_TABLE_SAS_URL }}")
          fi
          if [ -n "${{ secrets.JSS_COMMUNITY_DIRECTORY_TABLE_SAS_URL }}" ]; then
            extra_settings+=(JSS_COMMUNITY_DIRECTORY_TABLE_SAS_URL="${{ secrets.JSS_COMMUNITY_DIRECTORY_TABLE_SAS_URL }}")
          fi
          if [ -n "${{ secrets.JSS_Q_COHORT_KEY }}" ]; then
            extra_settings+=(JSS_Q_COHORT_KEY="${{ secrets.JSS_Q_COHORT_KEY }}")
          fi
          if [ -n "${{ secrets.JSS_Q_COHORT_HASHES }}" ]; then
            extra_settings+=(JSS_Q_COHORT_HASHES="${{ secrets.JSS_Q_COHORT_HASHES }}")
          fi
          if [ "${#extra_settings[@]}" -gt 0 ]; then
            az webapp config appsettings set \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$JSS_PROVISIONER_APP_NAME" \
              --settings "${extra_settings[@]}"
          fi

          relationship_key_count="$(az webapp config appsettings list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --query "length([?name=='JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY' && value!=''].value)" \
            --output tsv)"
          if [ "$relationship_key_count" != "1" ]; then
            echo "JSS_RELATIONSHIP_DELIVERY_SIGNING_KEY must be configured as a GitHub secret or retained App Service setting."
            exit 1
          fi

          for required_setting in \
            JSS_SESSION_SIGNING_KEY \
            JSS_TRANSPORT_IDENTITY_SIGNING_KEY \
            JSS_CREDENTIALS_TABLE_SAS_URL \
            JSS_COMMUNITY_DIRECTORY_TABLE_SAS_URL; do
            setting_count="$(az webapp config appsettings list \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$JSS_PROVISIONER_APP_NAME" \
              --query "length([?name=='${required_setting}' && value!=''].value)" \
              --output tsv)"
            if [ "$setting_count" != "1" ]; then
              echo "${required_setting} must be configured as a GitHub secret or retained App Service setting."
              exit 1
            fi
          done

      - name: Wait for provisioner SCM stabilization
        run: |
          set -euo pipefail
          scm_host="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --query defaultHostName -o tsv | sed 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')"
          consecutive_ready=0
          last_probe_error=""
          for attempt in {1..30}; do
            if probe_output="$(timeout 20s az rest \
              --method get \
              --url "https://${scm_host}/api/deployments" \
              --resource "https://management.azure.com/" \
              --output none 2>&1)"; then
              last_probe_error=""
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -eq 3 ]; then
                echo "Provisioner SCM is stable after configuration changes."
                break
              fi
            else
              consecutive_ready=0
              last_probe_error="$probe_output"
            fi
            if [ "$attempt" -eq 30 ]; then
              if [ -n "$last_probe_error" ]; then
                echo "Final provisioner SCM probe error: ${last_probe_error}" >&2
              else
                echo "Final provisioner SCM probe succeeded, but the stability threshold was not reached." >&2
              fi
              echo "Provisioner SCM did not stabilize before deployment."
              exit 1
            fi
            sleep 10
          done

      - name: Deploy JSS provisioner to App Service
        id: deploy-provisioner
        run: |
          set -euo pipefail
          scm_host="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --query defaultHostName -o tsv | sed 's/\.azurewebsites\.net$/.scm.azurewebsites.net/')"
          before_id="$(az rest \
            --method get \
            --url "https://${scm_host}/api/deployments" \
            --resource "https://management.azure.com/" \
            --query '[0].id' -o tsv)"
          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --src-path packages/jss-provisioner/deploy.zip \
            --type zip \
            --clean true \
            --ignore-stack true \
            --async true \
            --restart false \
            --track-status false

          deployment_id=""
          print_deployment_diagnostics() {
            if [ -z "$deployment_id" ]; then
              echo "No distinct provisioner Kudu deployment was observed."
              return
            fi
            az rest \
              --method get \
              --url "https://${scm_host}/api/deployments/${deployment_id}" \
              --resource "https://management.azure.com/" -o json || true
            az rest \
              --method get \
              --url "https://${scm_host}/api/deployments/${deployment_id}/log" \
              --resource "https://management.azure.com/" -o json || true
          }
          for attempt in {1..120}; do
            if deployments="$(timeout 20s az rest \
              --method get \
              --url "https://${scm_host}/api/deployments" \
              --resource "https://management.azure.com/" -o json 2>&1)"; then
              latest_id="$(jq -r '.[0].id // empty' <<<"$deployments")"
              if [ -n "$latest_id" ] && [ "$latest_id" != "$before_id" ]; then
                deployment_id="$latest_id"
                status="$(jq -r '.[0].status // 0' <<<"$deployments")"
                complete="$(jq -r '.[0].complete // false' <<<"$deployments")"
                if [ "$status" = "4" ] && [ "$complete" = "true" ]; then
                  echo "Provisioner Kudu deployment ${deployment_id} completed successfully."
                  break
                fi
                if [ "$status" = "3" ]; then
                  print_deployment_diagnostics
                  echo "Provisioner Kudu deployment ${deployment_id} failed."
                  exit 1
                fi
              fi
            else
              echo "Kudu deployment status polling failed; retrying: ${deployments}" >&2
            fi
            if [ "$attempt" -eq 120 ]; then
              print_deployment_diagnostics
              echo "Provisioner Kudu deployment did not reach terminal success."
              exit 1
            fi
            sleep 10
          done

      - name: Activate JSS provisioner artifact provenance
        run: |
          set -euo pipefail
          provisioner_artifact_sha256="$(sha256sum packages/jss-provisioner/deploy.zip | awk '{print $1}')"
          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$JSS_PROVISIONER_APP_NAME" \
            --settings \
              JSS_BUILD_COMMIT="${GITHUB_SHA}" \
              JSS_BUILD_ARTIFACT_SHA256="${provisioner_artifact_sha256}" \
            --output none

      - name: Verify JSS provisioner health
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_PAYLOAD_SHA256: ${{ steps.package-provisioner.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          health_url="https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/health"
          echo "Waiting for provisioner health: ${health_url}"
          consecutive_healthy=0
          health_deadline=$((SECONDS + 600))
          attempt=0
          expected_artifact_sha="$(sha256sum packages/jss-provisioner/deploy.zip | awk '{print $1}')"

          health_contract_matches() {
            jq -e \
              --arg commit "$EXPECTED_COMMIT" \
              --arg payload "$EXPECTED_PAYLOAD_SHA256" \
              --arg artifact "$expected_artifact_sha" \
              '.build.commit == $commit and
               .build.payloadSha256 == $payload and
               .build.configuredArtifactSha256 == $artifact and
               .communityDirectory.backend == "table" and
               .communityDirectory.ready == true and
               .transportIdentity.ready == true and
               .session.signingKeyConfigured == true and
               .milestoneQ.flags.directory == false and
               .milestoneQ.flags["peer-profile"] == false and
               .milestoneQ.flags.relationship == false and
               .milestoneQ.flags.transport == false' \
              "$1" >/dev/null
          }

          print_health_diagnostics() {
            local health_file="$1"
            if [ -f "$health_file" ]; then
              echo "Final sanitized provisioner health document:"
              cat "$health_file"
            fi
          }

          while (( SECONDS < health_deadline )); do
            attempt=$((attempt + 1))
            remaining_seconds=$((health_deadline - SECONDS))
            if (( remaining_seconds <= 0 )); then
              break
            fi
            fetch_timeout_ms=$((remaining_seconds * 1000))
            if (( fetch_timeout_ms > 10000 )); then
              fetch_timeout_ms=10000
            fi
            rm -f /tmp/provisioner-health.json
            if NZ_FETCH_TIMEOUT_MS="$fetch_timeout_ms" node ./scripts/qa/fetch-exact.mjs "$health_url" /tmp/provisioner-health.json; then
              deployed_commit="$(jq -r '.build.commit // empty' /tmp/provisioner-health.json)"
              payload_sha="$(jq -r '.build.payloadSha256 // empty' /tmp/provisioner-health.json)"
              configured_artifact_sha="$(jq -r '.build.configuredArtifactSha256 // empty' /tmp/provisioner-health.json)"
              directory_backend="$(jq -r '.communityDirectory.backend // empty' /tmp/provisioner-health.json)"
              directory_ready="$(jq -r '.communityDirectory.ready // false' /tmp/provisioner-health.json)"
              transport_ready="$(jq -r '.transportIdentity.ready // false' /tmp/provisioner-health.json)"
              signing_key_ready="$(jq -r '.session.signingKeyConfigured // false' /tmp/provisioner-health.json)"
              q_directory_enabled="$(jq -r '.milestoneQ.flags.directory // true' /tmp/provisioner-health.json)"
              q_peer_profile_enabled="$(jq -r '.milestoneQ.flags["peer-profile"] // true' /tmp/provisioner-health.json)"
              q_relationship_enabled="$(jq -r '.milestoneQ.flags.relationship // true' /tmp/provisioner-health.json)"
              q_transport_enabled="$(jq -r '.milestoneQ.flags.transport // true' /tmp/provisioner-health.json)"
              if health_contract_matches /tmp/provisioner-health.json; then
                consecutive_healthy=$((consecutive_healthy + 1))
                echo "Provisioner health and provenance passed on attempt ${attempt} (${consecutive_healthy}/3 consecutive)."
                if [ "$consecutive_healthy" -eq 3 ]; then
                  remaining_seconds=$((health_deadline - SECONDS))
                  if (( remaining_seconds < 40 )); then
                    echo "Provisioner became ready without enough deadline budget for the 30-second stability hold."
                    break
                  fi
                  echo "Holding exact provenance for 30 seconds before mutating staging checks."
                  sleep 30
                  remaining_seconds=$((health_deadline - SECONDS))
                  rm -f /tmp/provisioner-stable-health.json
                  if (( remaining_seconds <= 0 )) || \
                    ! timeout "${remaining_seconds}s" env NZ_FETCH_TIMEOUT_MS=10000 \
                      node ./scripts/qa/fetch-exact.mjs "$health_url" /tmp/provisioner-stable-health.json || \
                    ! health_contract_matches /tmp/provisioner-stable-health.json || \
                    (( SECONDS > health_deadline )); then
                    if [ -f /tmp/provisioner-stable-health.json ]; then
                      print_health_diagnostics /tmp/provisioner-stable-health.json
                    else
                      print_health_diagnostics /tmp/provisioner-health.json
                    fi
                    echo "Provisioner readiness contract changed during stabilization."
                    exit 1
                  fi
                  mv /tmp/provisioner-stable-health.json /tmp/provisioner-health.json
                  cat /tmp/provisioner-health.json
                  exit 0
                fi
              else
                consecutive_healthy=0
                echo "Attempt ${attempt}: health mismatch (commit='${deployed_commit}', payload='${payload_sha}', artifact='${configured_artifact_sha}', directoryBackend='${directory_backend}', directoryReady='${directory_ready}', transportReady='${transport_ready}', signingKeyReady='${signing_key_ready}', qDirectory='${q_directory_enabled}', qPeerProfile='${q_peer_profile_enabled}', qRelationship='${q_relationship_enabled}', qTransport='${q_transport_enabled}')."
              fi
            else
              consecutive_healthy=0
            fi

            remaining_seconds=$((health_deadline - SECONDS))
            if (( remaining_seconds <= 0 )); then
              break
            fi
            sleep_seconds=10
            if (( remaining_seconds < sleep_seconds )); then
              sleep_seconds=$remaining_seconds
            fi
            echo "Attempt ${attempt}: exact health fetch or readiness check failed. Retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

          print_health_diagnostics /tmp/provisioner-health.json
          echo "Provisioner failed health check within the 600-second deadline."
          exit 1

      - name: Warm JSS provisioner onboarding endpoint
        run: |
          set -euo pipefail
          warmup_url="https://${JSS_PROVISIONER_APP_NAME}.azurewebsites.net/v1/solid-account/check-email"
          payload='{"email":"qa-warmup+staging@nodezero.social"}'

          for attempt in {1..20}; do
            rm -f /tmp/provisioner-warmup.json
            if NZ_FETCH_METHOD=POST \
              NZ_FETCH_BODY="$payload" \
              NZ_FETCH_HEADERS_JSON='{"content-type":"application/json","accept":"application/json"}' \
              NZ_FETCH_TIMEOUT_MS=15000 \
              node ./scripts/qa/fetch-exact.mjs "$warmup_url" /tmp/provisioner-warmup.json; then
              echo "Provisioner warmup succeeded on attempt ${attempt}."
              cat /tmp/provisioner-warmup.json
              exit 0
            fi

            echo "Attempt ${attempt}/20: exact warmup fetch failed. Retrying in 6s..."
            sleep 6
          done

          echo "Provisioner warmup failed after 20 attempts."
          exit 1

      - name: Build and package relay service
        id: package-relay
        working-directory: packages/relay-service
        run: |
          set -euo pipefail
          pnpm build
          rm -rf deploy
          pnpm --config.inject-workspace-packages=true \
            --filter @nodezero/relay-service deploy --prod "$(pwd)/deploy"
          payload_sha256="$(find deploy -type f ! -name build-info.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          printf '{"commit":"%s","payloadSha256":"%s"}\n' "$GITHUB_SHA" "$payload_sha256" > deploy/build-info.json
          echo "payload_sha256=${payload_sha256}" >> "$GITHUB_OUTPUT"
          rm -f deploy.zip
          cd deploy
          zip -r ../deploy.zip .

      - name: Configure and deploy relay service
        run: |
          set -euo pipefail
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$RELAY_APP_NAME" \
            --linux-fx-version "NODE|22-lts" \
            --always-on true \
            --generic-configurations '{"healthCheckPath":"/health"}' \
            --startup-file "node dist/index.js"

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$RELAY_APP_NAME" \
            --settings \
              RELAY_PROVISIONER_URL="https://api.nodezero.social" \
              RELAY_PORT="8080" \
              WEBSITES_PORT="8080"

          az webapp deploy \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$RELAY_APP_NAME" \
            --src-path packages/relay-service/deploy.zip \
            --type zip \
            --clean true

      - name: Verify relay health and identity verifier configuration
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_PAYLOAD_SHA256: ${{ steps.package-relay.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          relay_health_url="https://${RELAY_APP_NAME}.azurewebsites.net/health"
          for attempt in {1..30}; do
            rm -f /tmp/relay-health.json
            if NZ_FETCH_TIMEOUT_MS=10000 node ./scripts/qa/fetch-exact.mjs "$relay_health_url" /tmp/relay-health.json && \
              [ "$(jq -r '.identityVerifierConfigured // false' /tmp/relay-health.json)" = "true" ] && \
              [ "$(jq -r '.identityVerifierReachable // false' /tmp/relay-health.json)" = "true" ] && \
              [ "$(jq -r '.transportEnabled // true' /tmp/relay-health.json)" = "false" ] && \
              [ "$(jq -r '.build.commit // empty' /tmp/relay-health.json)" = "$EXPECTED_COMMIT" ] && \
              [ "$(jq -r '.build.payloadSha256 // empty' /tmp/relay-health.json)" = "$EXPECTED_PAYLOAD_SHA256" ]; then
              cat /tmp/relay-health.json
              exit 0
            fi
            echo "Attempt ${attempt}/30: exact relay health fetch or provenance check failed. Retrying in 10s..."
            sleep 10
          done
          echo "Relay failed health/configuration check after 30 attempts."
          exit 1

      - name: Build Expo web artifact
        env:
          # Full staging-testnet profile. NZ_ENV_PROFILE enables the strict
          # variable checks in app.config.js, so a build missing any of these
          # fails instead of silently shipping a local-profile bundle (which
          # would drop the Node Zero Community Server as the default IdP).
          NZ_ENV_PROFILE: staging-testnet
          NZ_RELAY_URL: wss://nodezero-social-staging-testnet-relay.azurewebsites.net
          NZ_IDENTITY_CONTRACT_ID: CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K
          NZ_LOCKBOX_CONTRACT_ID: CB36LY5WZLJNMY4DHRXQER6LU3L4E5MGFYT2XSJG7ZJZV5SIIOKODT2H
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_FACTORY_VERSION: '3'
          NZ_ZK_ARTIFACTS_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/
          NZ_ZK_MANIFEST_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json
          NZ_NODEZERO_ISSUER_URL: https://solid.nodezero.social/
          NZ_NODEZERO_DIRECTORY_URL: https://api.nodezero.social/v1/community-directory/index
          NZ_APP_ORIGIN: https://staging.nodezero.social
          NZ_SEAMLESS_ONBOARDING_ENABLED: 'true'
          NZ_JSS_PROVISIONER_URL: https://api.nodezero.social
          NZ_BROWSER_SESSION_ENABLED: 'true'
          NZ_SOLID_BOOTSTRAP_ENABLED: 'true'
          NZ_MASHLIB_EXPLORER_ENABLED: 'true'
          NZ_MASHLIB_MODULE_ID: nodezero:mashlib-pane-provider
        run: pnpm --filter @nodezero/mobile-app build:web

      - name: Validate PWA web artifact
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_APP_ORIGIN: https://staging.nodezero.social
        run: pnpm pwa:validate:artifact

      - name: Write staging deploy marker
        run: |
          cat > packages/mobile-app/dist/deploy-marker.json <<EOF
          {
            "environment": "staging-testnet",
            "workflow": "staging-deploy",
            "commit": "${GITHUB_SHA}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "generatedAtUtc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Add Static Web Apps navigation fallback
        run: cp packages/mobile-app/staticwebapp.config.json packages/mobile-app/dist/staticwebapp.config.json

      - name: Resolve Static Web Apps deployment token
        id: swa-token
        run: |
          token="$(az staticwebapp secrets list --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv)"
          if [ -z "$token" ]; then
            echo "Unable to resolve Static Web Apps deployment token."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish Expo web artifact to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: packages/mobile-app/dist
          api_location: ''
          output_location: ''
          skip_app_build: true

      - name: Resolve staging hostname
        id: hostname
        run: |
          STATIC_WEB_APP_HOSTNAME="$(az staticwebapp show --name "$STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query defaultHostname -o tsv)"
          if [ -z "$STATIC_WEB_APP_HOSTNAME" ]; then
            echo "Unable to resolve the Static Web App hostname."
            exit 1
          fi
          echo "hostname=$STATIC_WEB_APP_HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Verify deployed marker provenance
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          marker_url="https://${{ steps.hostname.outputs.hostname }}/deploy-marker.json"
          echo "Checking marker: ${marker_url}"

          for attempt in {1..18}; do
            rm -f /tmp/deploy-marker.json
            if ! node ./scripts/qa/fetch-exact.mjs "$marker_url" /tmp/deploy-marker.json; then
              echo "Attempt ${attempt}/18: exact marker fetch failed. Retrying in 10s..."
              sleep 10
              continue
            fi

            marker_env="$(jq -r '.environment // empty' /tmp/deploy-marker.json 2>/dev/null || true)"
            marker_workflow="$(jq -r '.workflow // empty' /tmp/deploy-marker.json 2>/dev/null || true)"
            marker_commit="$(jq -r '.commit // empty' /tmp/deploy-marker.json 2>/dev/null || true)"
            marker_run_id="$(jq -r '.runId // empty' /tmp/deploy-marker.json 2>/dev/null || true)"
            marker_run_attempt="$(jq -r '.runAttempt // empty' /tmp/deploy-marker.json 2>/dev/null || true)"

            if [ "$marker_env" = "staging-testnet" ] && \
               [ "$marker_workflow" = "staging-deploy" ] && \
              [ "$marker_commit" = "$EXPECTED_COMMIT" ] && \
              [ "$marker_run_id" = "$EXPECTED_RUN_ID" ] && \
              [ "$marker_run_attempt" = "$EXPECTED_RUN_ATTEMPT" ]; then
              echo "Marker provenance check passed on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt}/18: marker not updated yet (env='${marker_env}', workflow='${marker_workflow}', commit='${marker_commit}'). Retrying in 10s..."
            sleep 10
          done

          echo "Marker provenance check failed after retries. Expected commit '$EXPECTED_COMMIT'."
          exit 1

      - name: Run staging smoke suite
        env:
          STAGING_BASE_URL: https://${{ steps.hostname.outputs.hostname }}
        run: pnpm qa:smoke

      - name: Install Playwright browsers for auth gate
        run: pnpm exec playwright install chromium --with-deps

      - name: Verify public apex marker convergence for auth gate
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          marker_url="https://nodezero.social/deploy-marker.json"
          echo "Checking public apex marker: ${marker_url}"

          for attempt in {1..24}; do
            rm -f /tmp/staging-domain-marker.json
            if ! node ./scripts/qa/fetch-exact.mjs "$marker_url" /tmp/staging-domain-marker.json; then
              echo "Attempt ${attempt}/24: exact public marker fetch failed. Retrying in 10s..."
              sleep 10
              continue
            fi

            marker_env="$(jq -r '.environment // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"
            marker_workflow="$(jq -r '.workflow // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"
            marker_commit="$(jq -r '.commit // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"
            marker_run_id="$(jq -r '.runId // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"
            marker_run_attempt="$(jq -r '.runAttempt // empty' /tmp/staging-domain-marker.json 2>/dev/null || true)"

            if [ "$marker_env" = "staging-testnet" ] && \
               [ "$marker_workflow" = "staging-deploy" ] && \
               [ "$marker_commit" = "$EXPECTED_COMMIT" ] && \
               [ "$marker_run_id" = "$EXPECTED_RUN_ID" ] && \
               [ "$marker_run_attempt" = "$EXPECTED_RUN_ATTEMPT" ]; then
              echo "Public apex marker converged on attempt ${attempt}."
              exit 0
            fi

            echo "Attempt ${attempt}/24: public apex marker not converged (env='${marker_env}', workflow='${marker_workflow}', commit='${marker_commit}'). Retrying in 10s..."
            sleep 10
          done

          echo "Public apex marker did not converge to commit '$EXPECTED_COMMIT' before auth gate."
          exit 1

      # BLOCKING auth release gate: new-user onboarding (Pod + WebID + Stellar
      # lockb0x anchor + ZK attestation + inline NodeZero session), returning
      # one-tap Stellar sign-in, and fail-closed session enforcement —
      # end-to-end on staging. The browser must never contact the CSS origin.
      # No retry: session issuance is a single server round-trip with no
      # redirect-timing window.
      - name: Run onboarding/authentication E2E gate
        id: auth-e2e
        env:
          STAGING_BASE_URL: https://staging.nodezero.social
          NZ_INTERNAL_APP_URL: https://staging.nodezero.social
          NZ_EXPECT_INTERNAL_STAGING_HANDOFF: 'false'
          AUTH_E2E_SESSION_TIMEOUT_MS: '360000'
        run: pnpm qa:smoke:auth

      - name: Audit release-created V3 lockb0x state
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_AUDIT_LEDGER_WINDOW: '300'
          NZ_LOCKBOX_AUDIT_REQUIRE_EVENTS: 'true'
          NZ_LOCKBOX_AUDIT_EXPECTED_CHILD_IDS: ${{ steps.auth-e2e.outputs.lockbox_contract_id }}
        run: pnpm qa:audit:lockbox

      # Application-feature proofs (DocuStream/mashlib). NOT part of the auth
      # release gate — failures surface for triage without blocking identity.
      - name: Run DocuStream pane proof (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [ "${{ steps.auth-e2e.outputs.docustream_pane_passed }}" != "true" ]; then
            echo "Authenticated DocuStream pane probe did not pass."
            exit 1
          fi
          echo "Authenticated DocuStream pane probe passed in the identity browser context."

      - name: Run focused mashlib runtime proof (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        env:
          NZ_ENV_PROFILE: staging-testnet
          NZ_RELAY_URL: wss://nodezero-social-staging-testnet-relay.azurewebsites.net
          NZ_IDENTITY_CONTRACT_ID: CCHFYOKLGVTXEYYHWEFPI22FR26VRGG2CBBUTP6XPW3ZSIWIKEVQQ44K
          NZ_LOCKBOX_CONTRACT_ID: CB36LY5WZLJNMY4DHRXQER6LU3L4E5MGFYT2XSJG7ZJZV5SIIOKODT2H
          NZ_LOCKBOX_FACTORY_CONTRACT_ID: CDFHCQA3YJCITWEMNLCSRGQVVFEXGTONWSQJTD5VIZO7YV4IOKZUPCGT
          NZ_LOCKBOX_FACTORY_VERSION: '3'
          NZ_ZK_ARTIFACTS_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/
          NZ_ZK_MANIFEST_URL: https://stki7yquyjmnskg.blob.core.windows.net/zk-artifacts/lockb0x-bridge-v3/zk-testnet-lockbox-bridge-v3-artifacts.json
          NZ_NODEZERO_ISSUER_URL: https://solid.nodezero.social/
          NZ_JSS_PROVISIONER_URL: https://api.nodezero.social
          NZ_BROWSER_SESSION_ENABLED: 'true'
          NZ_SOLID_BOOTSTRAP_ENABLED: 'true'
          NZ_MASHLIB_EXPLORER_ENABLED: 'true'
          NZ_MASHLIB_MODULE_ID: nodezero:mashlib-pane-provider
        run: pnpm qa:smoke:mashlib-runtime

      - name: Run deployed mashlib bundle proof (non-blocking)
        if: ${{ always() }}
        continue-on-error: true
        env:
          STAGING_BASE_URL: https://${{ steps.hostname.outputs.hostname }}
        run: pnpm qa:smoke:mashlib-deployed

      - name: Staging deployment summary
        run: echo "Staging infrastructure deployment, Expo web publish, smoke suite, and auth E2E gate completed."

      - name: Build retained rollback bundle manifest
        run: |
          set -euo pipefail
          mkdir -p rollback-bundle
          provisioner_sha="$(sha256sum packages/jss-provisioner/deploy.zip | awk '{print $1}')"
          relay_sha="$(sha256sum packages/relay-service/deploy.zip | awk '{print $1}')"
          (cd packages/mobile-app/dist && find . -type f ! -name deploy-marker.json ! -name staticwebapp.config.json -print0 | sort -z | xargs -0 sha256sum) > rollback-bundle/pwa-files.sha256
          rm -rf /tmp/rollback-provisioner
          mkdir -p /tmp/rollback-provisioner
          unzip -q packages/jss-provisioner/deploy.zip -d /tmp/rollback-provisioner
          (cd /tmp/rollback-provisioner && find . -type f -print0 | sort -z | xargs -0 sha256sum) > rollback-bundle/provisioner-files.sha256
          (cd packages/relay-service/deploy && find . -type f -print0 | sort -z | xargs -0 sha256sum) > rollback-bundle/relay-files.sha256
          pwa_sha="$(sha256sum rollback-bundle/pwa-files.sha256 | awk '{print $1}')"
          provisioner_tree_sha="$(sha256sum rollback-bundle/provisioner-files.sha256 | awk '{print $1}')"
          relay_tree_sha="$(sha256sum rollback-bundle/relay-files.sha256 | awk '{print $1}')"
          cp packages/jss-provisioner/deploy.zip rollback-bundle/provisioner.zip
          cp packages/relay-service/deploy.zip rollback-bundle/relay.zip
          cp -r packages/mobile-app/dist rollback-bundle/pwa-dist
          cat > rollback-bundle/manifest.json <<EOF
          {
            "version": 1,
            "environment": "staging-testnet",
            "commit": "${GITHUB_SHA}",
            "sourceRunId": "${GITHUB_RUN_ID}",
            "sourceRunAttempt": "${GITHUB_RUN_ATTEMPT}",
            "components": {
              "provisioner": {
                "provenance": "embedded-build-info",
                "commit": "${GITHUB_SHA}",
                "payloadSha256": "${{ steps.package-provisioner.outputs.payload_sha256 }}",
                "configuredArtifactSha256": "${provisioner_sha}"
              },
              "relay": {
                "provenance": "embedded-build-info",
                "commit": "${GITHUB_SHA}",
                "payloadSha256": "${{ steps.package-relay.outputs.payload_sha256 }}"
              }
            },
            "qFlags": {
              "directory": false,
              "peerProfile": false,
              "relationship": false,
              "transport": false
            },
            "sha256": {
              "provisionerZip": "${provisioner_sha}",
              "provisionerTree": "${provisioner_tree_sha}",
              "relayZip": "${relay_sha}",
              "relayTree": "${relay_tree_sha}",
              "pwaTree": "${pwa_sha}"
            }
          }
          EOF

      - name: Retain exact-SHA rollback bundle
        uses: actions/upload-artifact@v4
        with:
          name: staging-rollback-${{ github.sha }}-${{ github.run_attempt }}
          path: rollback-bundle
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  certify-physical-devices:
    name: Exact-SHA physical-device certification
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.certify_physical_devices == true }}
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact live candidate
        run: |
          set -euo pipefail
          node ./scripts/qa/fetch-exact.mjs https://staging.nodezero.social/deploy-marker.json /tmp/deploy-marker.json
          live_sha="$(jq -r '.commit // empty' /tmp/deploy-marker.json)"
          live_run_id="$(jq -r '.runId // empty' /tmp/deploy-marker.json)"
          live_run_attempt="$(jq -r '.runAttempt // empty' /tmp/deploy-marker.json)"
          if [ "$live_sha" != "$GITHUB_SHA" ]; then
            echo "Live marker ${live_sha} does not match candidate ${GITHUB_SHA}."
            exit 1
          fi
          [ "$live_run_id" = "${{ github.run_id }}" ]
          [ "$live_run_attempt" = "${{ github.run_attempt }}" ]

      - name: Require physical-device runner and installed evidence
        env:
          DEVICE_ENDPOINT: ${{ secrets.NZ_DEVICE_CLOUD_ENDPOINT }}
          DEVICE_TOKEN: ${{ secrets.NZ_DEVICE_CLOUD_TOKEN }}
          INSTALLED_EVIDENCE_JSON: ${{ inputs.installed_evidence_json }}
        run: |
          if [ -z "$DEVICE_ENDPOINT" ] || [ -z "$DEVICE_TOKEN" ]; then
            echo "Physical-device runner credentials are not configured."
            exit 1
          fi
          if [ -z "$INSTALLED_EVIDENCE_JSON" ]; then
            echo "Certification requires sanitized iOS and Android installed-PWA evidence."
            exit 1
          fi

      - name: Run physical browser-tab lanes
        env:
          NZ_DEVICE_CLOUD_ENDPOINT: ${{ secrets.NZ_DEVICE_CLOUD_ENDPOINT }}
          NZ_DEVICE_CLOUD_TOKEN: ${{ secrets.NZ_DEVICE_CLOUD_TOKEN }}
          NZ_DEVICE_EXPECTED_SHA: ${{ github.sha }}
          NZ_DEVICE_EXPECTED_URL: https://staging.nodezero.social
          NZ_DEVICE_CLOUD_OUTPUT: device-evidence/browser-tab.json
        run: |
          mkdir -p device-evidence
          node scripts/qa/run-device-cloud.mjs

      - name: Validate browser-tab evidence
        env:
          NZ_DEVICE_EXPECTED_SHA: ${{ github.sha }}
          NZ_DEVICE_EXPECTED_URL: https://staging.nodezero.social
          NZ_DEVICE_REQUIRED_MODES: browser-tab
        run: node scripts/qa/validate-device-evidence.mjs device-evidence/browser-tab.json

      - name: Validate installed-PWA evidence
        env:
          INSTALLED_EVIDENCE_JSON: ${{ inputs.installed_evidence_json }}
          NZ_DEVICE_EXPECTED_SHA: ${{ github.sha }}
          NZ_DEVICE_EXPECTED_URL: https://staging.nodezero.social
          NZ_DEVICE_REQUIRED_MODES: installed-pwa
        run: |
          printf '%s\n' "$INSTALLED_EVIDENCE_JSON" > device-evidence/installed-pwa.json
          node scripts/qa/validate-device-evidence.mjs device-evidence/installed-pwa.json

      - name: Upload sanitized physical-device summaries
        uses: actions/upload-artifact@v4
        with:
          name: pwa-device-evidence-${{ github.sha }}
          path: device-evidence/*.json
          retention-days: 7
          if-no-files-found: error
